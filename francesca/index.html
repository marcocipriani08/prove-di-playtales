<style>
/* Stile comune dei minigiochi di El Falcon e Il Crocco: stesso aspetto di Operazione Viaggettino
   (notte viola, limone, corallo, Pixelify Sans + VT323, pannelli con bordo chiaro e ombra piena). */
:root {
  --night: #1b1530; --night-2: #120e24; --panel: #2a2145; --panel-2: #352a58; --line: #4a3d78;
  --ink: #fff6e0; --ink-dim: #c9bfe0; --lemon: #ffd84a; --lemon-dk: #d9b21f; --coral: #ff6b57; --sea: #7cc6e8; --leaf: #7fd18a; --rose: #f2a3b0;
  --paper: #fff6e0; --paper-ink: #2a1a2e; --red: #c0392b;
  --f-display: "Pixelify Sans", "Courier New", monospace; --f-num: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif; --f-body: "VT323", "Courier New", monospace; --f-hand: "Caveat", "Comic Sans MS", cursive;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; touch-action: manipulation; }
body { background: var(--night-2); color: var(--ink); overflow: hidden; overscroll-behavior: none; font-family: var(--f-display); -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
button, input { font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
#app { position: fixed; inset: 0; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; background: var(--night-2); }
canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
#cv { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
#fx { position: absolute; left: 0; top: 0; pointer-events: none; }
button { font-family: var(--f-display); color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--lemon); outline-offset: 2px; }

/* Top bar chips */
.topbar { position: absolute; top: calc(8px + var(--sat)); right: max(10px, var(--sar)); display: flex; gap: 6px; z-index: 30; }
.chip { background: rgba(18,14,36,.72); border: 2px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--ink); line-height: 1; }
.chip:active { background: var(--panel-2); }

/* Big buttons (title, panels) */
.btn { border: 3px solid var(--paper-ink); border-radius: 12px; padding: 13px 16px; font-size: 18px; font-weight: 700; background: var(--ink); color: var(--paper-ink); box-shadow: 0 5px 0 var(--paper-ink); line-height: 1.05; transition: transform .06s, box-shadow .06s; }
.btn.primary { background: var(--lemon); }
.btn.coral { background: var(--coral); }
.btn.leaf { background: var(--leaf); }
.btn.ghost { background: transparent; color: var(--ink-dim); border-color: var(--line); box-shadow: none; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--paper-ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 17px; opacity: .8; margin-top: 2px; }

/* Title screen */
.title { position: absolute; inset: 0; z-index: 20; overflow-y: auto; background: linear-gradient(180deg, #2a1f55 0%, #6a3a6e 48%, #e86a5a 78%, #ffb36b 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: calc(24px + var(--sat)) max(16px, var(--sar)) calc(24px + var(--sab)) max(16px, var(--sal)); text-align: center; }
.title::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 16%; background: repeating-linear-gradient(180deg, #2a2a6a 0 4px, #3a3a8a 4px 8px); opacity: .9; pointer-events: none; }
.t-eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--lemon); position: relative; z-index: 1; }
.t-name { margin: 0; font-size: clamp(34px, 10vw, 64px); line-height: .92; font-weight: 700; color: var(--ink); text-shadow: 3px 3px 0 var(--paper-ink), 6px 6px 0 rgba(0,0,0,.25); position: relative; z-index: 1; text-wrap: balance; }
.t-sub { margin: -4px 0 0; font-family: var(--f-body); font-size: 22px; line-height: 1.05; color: var(--ink); position: relative; z-index: 1; max-width: 340px; text-wrap: balance; }
.t-art { image-rendering: pixelated; position: relative; z-index: 1; }
.t-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; width: min(100%, 300px); position: relative; z-index: 1; }
.t-foot { position: relative; z-index: 1; font-family: var(--f-body); font-size: 18px; color: var(--ink); opacity: .85; margin: 0; }

/* Dialog box (portrait + name + typewriter text) */
#dialog { position: absolute; left: max(10px, var(--sal)); right: max(10px, var(--sar)); bottom: calc(14px + var(--sab)); z-index: 40; max-width: 680px; margin: 0 auto; min-height: 112px; background: var(--panel); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 0 0 3px var(--night-2), 0 10px 30px rgba(0,0,0,.45); display: flex; gap: 12px; padding: 12px 14px 14px; cursor: pointer; }
#dialog[data-who="narr"] { background: #241c3d; border-color: var(--ink-dim); }
#dialog[data-who="narr"] #dlg-portrait { display: none; }
#dlg-portrait { width: 68px; height: 68px; flex: none; image-rendering: pixelated; background: var(--night); border-radius: 8px; border: 2px solid var(--line); align-self: flex-start; }
.dlg-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
#dlg-name { font-size: 14px; font-weight: 700; letter-spacing: .04em; }
#dlg-text { font-family: var(--f-body); font-size: 23px; line-height: 1.12; color: var(--ink); text-wrap: pretty; }
#dlg-more { position: absolute; right: 14px; bottom: 8px; color: var(--lemon); font-size: 12px; animation: bob .8s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }

/* Overlay + panel */
.overlay { position: absolute; inset: 0; z-index: 25; display: flex; align-items: center; justify-content: center; padding: calc(16px + var(--sat)) max(16px, var(--sar)) calc(16px + var(--sab)) max(16px, var(--sal)); background: rgba(10,7,22,.66); overflow-y: auto; }
.panel { width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; background: var(--panel); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 0 0 3px var(--night-2), 0 16px 40px rgba(0,0,0,.5); padding: 16px; display: flex; flex-direction: column; gap: 12px; margin: auto; }
.panel h2 { margin: 0; font-size: 24px; line-height: 1; }
.panel .sub { margin: -4px 0 0; font-family: var(--f-body); font-size: 20px; color: var(--ink-dim); line-height: 1.1; }
.panel .row { display: flex; gap: 8px; flex-wrap: wrap; }
.panel .row .btn { flex: 1; }

/* Toast */
#toast { position: absolute; left: 50%; top: calc(56px + var(--sat)); transform: translate(-50%, -6px); z-index: 45; pointer-events: none; background: var(--ink); color: var(--paper-ink); border-radius: 10px; padding: 7px 12px; font-family: var(--f-body); font-size: 21px; line-height: 1; max-width: calc(100% - 32px); text-align: center; opacity: 0; transition: opacity .2s, transform .25s cubic-bezier(.2,1.6,.4,1); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Paper note with a portrait ("Il Crocco: ...") on results panels */
.say-card { background: var(--paper); color: var(--paper-ink); border-radius: 14px; padding: 12px 14px; box-shadow: 0 0 0 3px var(--paper-ink); display: flex; gap: 12px; align-items: flex-start; }
.say-card canvas { width: 56px; height: 56px; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; background: var(--night); border-radius: 8px; border: 2px solid var(--paper-ink); }
.say-card p { margin: 0; font-family: var(--f-body); font-size: 22px; line-height: 1.08; text-wrap: pretty; }
.say-card b { display: block; font-family: var(--f-display); font-size: 13px; color: var(--red); margin-bottom: 2px; }
.panel .say-card { border-radius: 12px; padding: 10px 12px; }
.panel .say-card canvas { width: 48px; height: 48px; }
.panel .say-card p { font-size: 21px; line-height: 1.05; }

/* "Apri la lettera": the button with the red seal that leads to the ending */
.btn.letter { display: flex; align-items: center; justify-content: center; gap: 10px; animation: letterGlow 1.6s ease-in-out infinite; }
.btn.letter .seal { width: 24px; height: 24px; flex: none; border-radius: 50%; background: var(--red); color: var(--paper); border: 2px solid var(--paper-ink); display: grid; place-items: center; font-size: 12px; line-height: 1; }
@keyframes letterGlow { 50% { box-shadow: 0 5px 0 var(--paper-ink), 0 0 0 4px rgba(255,216,74,.45); } }
.panel .row .btn.letter { flex-basis: 100%; }

/* Text only for screen readers */
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Postcard card (paper, dashed margin, tilted photo, stamp) */
.pc-card { width: min(100%, 420px); margin: auto; background: var(--paper); color: var(--paper-ink); border-radius: 14px; padding: 14px 14px 14px 22px; position: relative; box-shadow: 0 0 0 3px var(--paper-ink), 8px 8px 0 var(--lemon); display: flex; flex-direction: column; gap: 8px; animation: pcin .45s cubic-bezier(.2,1.3,.4,1) both; }
.pc-card::before { content: ""; position: absolute; left: 9px; top: 12px; bottom: 12px; border-left: 3px dashed #c9b89c; }
@keyframes pcin { from { transform: translateY(30px) scale(.92) rotate(-2deg); opacity: 0; } to { transform: none; opacity: 1; } }
.pc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pc-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--red); }
.pc-no { font-family: var(--f-num); font-weight: 700; font-size: 14px; color: #8a7a6a; font-variant-numeric: tabular-nums; }
.pc-photo { position: relative; width: min(100%, 52vh); align-self: center; background: #fff; padding: 6px 6px 16px; box-shadow: 0 2px 0 #c9b89c, 0 0 0 1px #e3d8c4; transform: rotate(-1.2deg); }
.pc-photo canvas { display: block; width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; image-rendering: crisp-edges; }
.pc-stamp { position: absolute; right: -8px; bottom: -6px; transform: rotate(-12deg) scale(2.2); opacity: 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--red); border: 3px solid var(--red); border-radius: 8px; padding: 3px 8px; background: rgba(255,246,224,.85); }
.pc-stamp.on { opacity: 1; transform: rotate(-12deg) scale(1); transition: transform .22s cubic-bezier(.3,1.6,.5,1), opacity .1s; }
.pc-name { margin: 4px 0 0; font-size: clamp(24px, 7vw, 32px); line-height: 1; color: var(--paper-ink); text-wrap: balance; }
.pc-cap { margin: 0; font-family: var(--f-body); font-size: 22px; line-height: 1.1; color: #4a3a5a; text-wrap: pretty; }
.pc-stats { display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--f-num); font-weight: 700; font-size: 14px; color: #6a5a7a; font-variant-numeric: tabular-nums; }
.pc-stats b { color: var(--paper-ink); }
.pc-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pc-btns .btn { padding: 9px 14px; font-size: 15px; box-shadow: 0 3px 0 var(--paper-ink); }
.pc-btns .btn.ghost, .intro-card .btn.ghost { color: var(--paper-ink); border-color: #c9b89c; box-shadow: none; } /* readable on paper */
/* phone held sideways: photo on the left, words and buttons on the right, everything visible without scrolling */
@media (orientation: landscape) and (max-height: 500px) {
  .pc-card { display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr); grid-template-rows: auto auto auto auto 1fr; grid-template-areas: "top top" "photo name" "photo cap" "photo stats" "photo btns"; column-gap: 16px; row-gap: 6px; width: min(100%, 700px); align-items: start; }
  .pc-card .pc-top { grid-area: top; } .pc-card .pc-photo { grid-area: photo; width: 100%; align-self: start; }
  .pc-card .pc-name { grid-area: name; margin: 0; } .pc-card .pc-cap { grid-area: cap; font-size: 19px; line-height: 1.05; }
  .pc-card .pc-stats { grid-area: stats; } .pc-card .pc-btns { grid-area: btns; align-self: end; }
}

/* Ending: envelope, cake, card (copied look from Viaggettino) */
#ending { position: absolute; inset: 0; z-index: 50; overflow-y: auto; background: #2a1f45; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: calc(18px + var(--sat)) max(16px, var(--sar)) calc(28px + var(--sab)) max(16px, var(--sal)); }
#end-cake { width: min(100%, 520px); aspect-ratio: 260 / 140; image-rendering: pixelated; border: 3px solid var(--ink); border-radius: 12px; flex: none; }
.end-card { width: min(100%, 520px); background: var(--paper); color: var(--paper-ink); border-radius: 14px; padding: 20px 20px 18px; box-shadow: 0 0 0 3px var(--paper-ink), 8px 8px 0 var(--coral); }
.end-card h2 { margin: 0 0 10px; font-size: clamp(26px, 7vw, 40px); line-height: 1; color: var(--red); text-wrap: balance; }
.end-card p { margin: 0; font-family: var(--f-body); font-size: 25px; line-height: 1.12; text-wrap: pretty; }
.end-card .sign { margin-top: 12px; text-align: right; font-family: var(--f-display); font-size: 16px; font-weight: 700; }
#end-stats { width: min(100%, 520px); margin: 0; font-family: var(--f-body); font-size: 19px; color: var(--ink-dim); text-align: center; line-height: 1.1; }
#end-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
#ending.env-mode > :not(#end-env) { display: none; }
#end-env { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; min-height: 70vh; cursor: pointer; outline: none; }
#end-env:focus-visible .env { outline: 3px solid var(--lemon); outline-offset: 8px; border-radius: 8px; }
.env { position: relative; width: min(78vw, 320px); aspect-ratio: 3 / 2; perspective: 700px; }

  .slot { background: var(--paper); border-radius: 8px; padding: 4px 4px 6px; box-shadow: 0 0 0 2px var(--paper-ink); color: var(--paper-ink); text-align: center; font-size: 11px; font-weight: 700; line-height: 1; border: 0; display: flex; flex-direction: column; gap: 4px; }
  .slot canvas { width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; }
  .slot.empty { background: rgba(255,246,224,.08); box-shadow: 0 0 0 2px var(--line); color: var(--ink-dim); }
  .slot.empty canvas { opacity: .14; filter: grayscale(1) brightness(.3); }
  .album-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .album-head h2 { font-family: var(--f-hand); font-size: 36px; color: var(--lemon); font-weight: 700; }
  .album-head span { font-family: var(--f-num); font-weight: 700; color: var(--ink-dim); }
  .result-stars { font-size: 40px; letter-spacing: 4px; color: var(--lemon); text-align: center; line-height: 1; }
  .result-stars span { display: inline-block; animation: starIn .45s cubic-bezier(.2,1.8,.4,1) both; }
  .result-stars span.off { color: var(--line); }
  @keyframes starIn { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }
  .stats { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; font-family: var(--f-num); font-weight: 700; font-size: 15px; color: var(--ink-dim); }
  .stats b { color: var(--ink); }

  /* the end of the game: all the photos fly into one Album, which closes */
  #assemble { position: absolute; inset: 0; z-index: 34; animation: abIn .6s ease both; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: calc(64px + var(--sat)) 16px calc(16px + var(--sab)); background: rgba(10,7,22,.62); }
  .card.gone { opacity: 0; transition: opacity .25s; }
  .ab { --w: min(460px, 96vw); position: relative; width: var(--w); height: calc(var(--w) * .66); display: flex; perspective: 1400px; }
  .ab-l, .ab-r { position: relative; width: 50%; height: 100%; }
  @keyframes abIn { from { background-color: transparent; } }

  .ab-r { background: repeating-linear-gradient(0deg, transparent 0 13px, rgba(166,124,82,.08) 13px 14px), linear-gradient(90deg, #e8d6ae 0, #fbefd2 9%, #fdf4dc 60%, #f3e3bd 100%); border-radius: 2px 8px 8px 2px; box-shadow: 0 0 0 3px var(--paper-ink), 2px 2px 0 1px #e9dcbc, 4px 4px 0 1px #d8c79f, 6px 6px 0 1px var(--paper-ink), 9px 11px 0 rgba(10,7,22,.4); }
  .ab-l, .ab-front, .ab-cover { will-change: transform; -webkit-transform: translateZ(0); }
  .ab-l { transform-origin: right center; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; z-index: 2; }
  .ab-front, .ab-cover { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .ab-front { background: repeating-linear-gradient(0deg, transparent 0 13px, rgba(166,124,82,.08) 13px 14px), linear-gradient(90deg, #f3e3bd 0, #fdf4dc 40%, #fbefd2 91%, #e8d6ae 100%); border-radius: 8px 2px 2px 8px; box-shadow: 0 0 0 3px var(--paper-ink), -2px 2px 0 1px #e9dcbc, -4px 4px 0 1px #d8c79f, -6px 6px 0 1px var(--paper-ink), -9px 11px 0 rgba(10,7,22,.4); }
  .ab-front::after { content: ""; position: absolute; right: 0; top: 4px; bottom: 4px; width: 14px; background: linear-gradient(90deg, transparent, rgba(42,26,46,.22)); pointer-events: none; }
  .ab-r::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 14px; background: linear-gradient(270deg, transparent, rgba(42,26,46,.22)); pointer-events: none; }
  .ab-slots { position: absolute; inset: 9% 9%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 7%; }
  .ab-slot { background: rgba(42,26,46,.07); border: 1.5px dashed rgba(42,26,46,.22); border-radius: 2px; transform: rotate(var(--rot)); }
  .ab-slot { position: relative; }
  .ab-slot.on { background: #fff; border: 0; padding: 2px 2px 5px; box-shadow: 0 0 0 1px #e3d8c4, 0 2px 0 #c9b89c, 0 3px 6px rgba(42,26,46,.18); animation: slotPop .35s cubic-bezier(.2,1.8,.4,1); }
  /* little black photo corners holding each picture */
  .ab-slot.on::before, .ab-slot.on::after, .ab-slot.on i::before, .ab-slot.on i::after { content: ""; position: absolute; width: 7px; height: 7px; background: #2a1a2e; }
  .ab-slot.on::before { left: -2px; top: -2px; clip-path: polygon(0 0, 100% 0, 0 100%); }
  .ab-slot.on::after { right: -2px; top: -2px; clip-path: polygon(0 0, 100% 0, 100% 100%); }
  .ab-slot.on i::before { left: -2px; bottom: -2px; clip-path: polygon(0 0, 0 100%, 100% 100%); }
  .ab-slot.on i::after { right: -2px; bottom: -2px; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  @keyframes slotPop { 0% { transform: rotate(var(--rot)) scale(1.25); } 100% { transform: rotate(var(--rot)) scale(1); } }
  .ab-slot canvas { display: block; width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; }
  .ab-fly { position: fixed; z-index: 2; background: #fff; padding: 4px 4px 9px; box-shadow: 0 0 0 1px #e3d8c4, 0 6px 14px rgba(10,7,22,.45); transform-origin: top left; transition: transform .6s cubic-bezier(.4,0,.2,1); }
  .ab-fly canvas { display: block; width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; }
  .ab-cover { visibility: hidden; transform: rotateY(180deg); border-radius: 3px 10px 10px 3px; overflow: hidden;
    background: radial-gradient(120% 90% at 30% 20%, rgba(255,255,255,.12), transparent 55%), repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 5px), linear-gradient(90deg, #7e2230 0, #9e2f3a 9%, #b8343c 12%, #b8343c 100%);
    box-shadow: 0 0 0 3px var(--paper-ink), 4px 5px 0 1px #fbefd2, 5px 6px 0 2px var(--paper-ink), 9px 11px 0 rgba(10,7,22,.45);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #fff3cf; text-align: center; }
  /* gold stitching and brass corners */
  .ab-cover::before { content: ""; position: absolute; inset: 9px 9px 9px 18px; border: 2px dashed rgba(255,216,74,.75); border-radius: 4px; pointer-events: none; }
  .ab-cover::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, #e7b84a 0 13px, transparent 13px) top left / 50% 50% no-repeat, linear-gradient(225deg, #e7b84a 0 13px, transparent 13px) top right / 50% 50% no-repeat, linear-gradient(45deg, #e7b84a 0 13px, transparent 13px) bottom left / 50% 50% no-repeat, linear-gradient(315deg, #e7b84a 0 13px, transparent 13px) bottom right / 50% 50% no-repeat; }
  .ab-emb { width: 44px; image-rendering: pixelated; filter: drop-shadow(0 2px 0 rgba(42,26,46,.5)); margin-left: 8px; }
  .ab-cover b { font-family: var(--f-hand); font-size: 44px; line-height: .9; color: #ffe6a0; text-shadow: 0 2px 0 #7e2230, 0 -1px 0 rgba(255,255,255,.35); margin-left: 8px; }
  .ab-cover .ab-n { font-family: var(--f-body); font-size: 18px; opacity: .9; margin-left: 8px; letter-spacing: .04em; }
  .ab-seal { z-index: 4; }
  .ab-rib { position: absolute; z-index: 0; right: 13%; bottom: -16px; width: 12px; height: 34px; background: #e7b84a; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); box-shadow: inset -3px 0 0 rgba(0,0,0,.15); }
  /* a gleam passes over the cover once it is sealed */
  .ab.sealed .ab-cover { animation: none; }
  .ab.sealed .ab-rib { animation: ribbon 1.6s ease-in-out .2s; transform-origin: top center; }
  @keyframes ribbon { 30% { transform: rotate(6deg); } 60% { transform: rotate(-4deg); } }
  .ab-shine { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(255,246,224,.55) 48%, transparent 60%); transform: translateX(-120%); }
  .ab.sealed .ab-shine { animation: shine 1.1s ease-out .35s both; }
  @keyframes shine { to { transform: translateX(120%); } }
  .ab-seal { position: absolute; right: -12px; bottom: -12px; width: 46px; height: 46px; border-radius: 50%; background: #9e2f3a; box-shadow: 0 0 0 3px var(--paper-ink); display: grid; place-items: center; font-style: normal; font-size: 22px; color: var(--paper); opacity: 0; transform: scale(2.2) rotate(-20deg); }

  .ab { transform-origin: 75% 50%; }
  .ab-seal { transition: transform .25s ease, opacity .2s; }
  .ab.sealed .ab-seal { opacity: 1; transform: rotate(-12deg); transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .1s; }
  .ab-btns { display: flex; width: min(360px, 92vw); justify-content: center; margin-top: 14px; }
  /* the photo finale: twelve little memories on the left, the last photo big on the right */
  .ab-slots.mini { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 6%; inset: 8% 8%; }
  .ab-big { position: absolute; inset: 16% 11% 22%; border: 2px dashed rgba(42,26,46,.3); border-radius: 3px; display: grid; place-items: center; transform: rotate(-2deg); }
  .ab-big span { font-family: var(--f-hand); font-weight: 700; font-size: 20px; color: rgba(42,26,46,.45); }
  .ab-big.on { overflow: hidden; border: 0; background: #fff; padding: 5px 5px 0; box-shadow: 0 0 0 1px #e3d8c4, 0 4px 10px rgba(10,7,22,.35); display: flex; flex-direction: column; gap: 3px; }
  .ab-big canvas { width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; display: block; }
  .ab-big b { font-family: var(--f-hand); font-size: 18px; color: var(--paper-ink); text-align: center; line-height: 1.1; }
  .ab-done { margin: 34px 0 0; font-family: var(--f-hand); font-weight: 700; font-size: 44px; line-height: 1; color: var(--lemon); text-shadow: 3px 3px 0 var(--paper-ink); animation: doneIn .6s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes doneIn { from { opacity: 0; transform: scale(.6) rotate(-4deg); } }
  @media (prefers-reduced-motion: reduce) { .ab-done { animation: none; } }
  /* «Sfoglia l'Album»: the page of the last photo */
  .bp-photo { width: min(78%, 300px); margin: 6px auto 4px; background: #fff; padding: 7px 7px 12px; box-shadow: 0 0 0 2px var(--paper-ink), 0 4px 0 #c9b89c; transform: rotate(-2deg); }
  .bp-photo canvas { display: block; width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; }
  .ab-btns .btn { flex: 1; max-width: 300px; }

  /* polaroids with their notes: end of a page and the Album leafing through */
  .sheet { background: var(--paper); border-radius: 10px; padding: 10px 12px 12px; box-shadow: 0 0 0 3px var(--paper-ink); color: var(--paper-ink); }
  .sheet-h { margin: 0 0 8px; font-family: var(--f-hand); font-weight: 700; font-size: 22px; line-height: 1; color: var(--red); }
  .polas { display: flex; flex-direction: column; gap: 10px; }
  .pola { display: grid; grid-template-columns: 34% 1fr; gap: 10px; align-items: center; animation: polaIn .45s cubic-bezier(.2,1.4,.4,1) both; }
  .pola .ph { background: #fff; padding: 4px 4px 10px; box-shadow: 0 0 0 1px #e3d8c4, 0 3px 0 #c9b89c; transform: rotate(var(--rot)); position: relative; }
  .pola .ph::after { content: ""; position: absolute; top: -6px; left: 50%; width: 46%; height: 11px; transform: translateX(-50%) rotate(-4deg); background: rgba(255,232,150,.72); }
  .pola canvas { display: block; width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; image-rendering: crisp-edges; }
  .pola b { display: block; font-size: 15px; line-height: 1; color: var(--paper-ink); }
  .pola p { margin: 2px 0 0; font-family: var(--f-body); font-size: 18px; line-height: 1.02; color: #4a3a5a; text-wrap: pretty; }
  @keyframes polaIn { from { opacity: 0; transform: translateY(10px) scale(.96); } }
  .page-done { gap: 10px; }
  /* on short screens the panel scrolls, but its buttons stay in sight */
  .page-done > .row, .ch-panel > .row { position: sticky; bottom: -16px; margin: 0 -16px -16px; padding: 10px 16px 16px; background: var(--panel); box-shadow: 0 -10px 12px -6px rgba(10,7,22,.5); z-index: 1; }
  .page-done .pola { grid-template-columns: 30% 1fr; }
  .row.next-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row.next-row .btn.wide { grid-column: 1 / -1; padding: 15px 16px; font-size: 20px; }
  .page-done .pola p { font-size: 17px; }
  .book { width: 100%; max-width: 440px; margin: auto; display: flex; flex-direction: column; gap: 12px; }
  .book-page { background: repeating-linear-gradient(0deg, transparent 0 17px, rgba(166,124,82,.07) 17px 18px), linear-gradient(90deg, #ead9b2 0, #fdf4dc 6%, #fbefd2 85%, #f1e0bb 100%); color: var(--paper-ink); border-radius: 6px 14px 14px 6px; box-shadow: 0 0 0 3px var(--paper-ink), 3px 3px 0 1px #e9dcbc, 6px 6px 0 1px #d8c79f, 8px 8px 0 1px var(--paper-ink), 12px 13px 0 rgba(10,7,22,.4); padding: 14px 16px 16px 22px; position: relative; transform-origin: left center; min-height: 320px; }
  .book-page::before { content: ""; position: absolute; left: 9px; top: 12px; bottom: 12px; border-left: 3px dashed #c9b89c; }
  .book-stage { position: relative; perspective: 1600px; }
  .book-leaf { position: absolute; left: 0; top: 0; width: 100%; z-index: 3; transform-origin: left center; backface-visibility: hidden; -webkit-backface-visibility: hidden; animation: leaf .75s cubic-bezier(.45,.05,.35,1) both; pointer-events: none; }
  /* the turning page and everything on it vanish together once it is edge-on (photos included) */
  .book-leaf * { animation: none !important; }
  @keyframes leaf { 0% { transform: rotateY(0); opacity: 1; } 49% { opacity: 1; } 50% { opacity: 0; } 100% { transform: rotateY(-180deg); opacity: 0; } }
  .book-h { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--red); }
  .book-page h2 { margin: 2px 0 12px; font-family: var(--f-hand); font-size: 38px; line-height: .95; font-weight: 700; color: var(--paper-ink); }
  .book-page .polas.big .pola p { font-size: 19px; }
  .book-page.last { display: flex; flex-direction: column; }
  .book-page.last .pocket { margin: auto; }
  .book-end { margin: 0; font-family: var(--f-body); font-size: 23px; line-height: 1.08; color: #4a3a5a; }
  .book-foot { display: flex; flex-direction: column; gap: 10px; }
  .book-foot .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .book-foot .row .btn { flex: 1; }
  .book-dots { display: flex; gap: 6px; justify-content: center; }
  .book-dots i { width: 10px; height: 10px; border-radius: 2px; background: var(--line); }
  .book-dots i.on { background: var(--lemon); }
  @media (prefers-reduced-motion: reduce) {
    .card .in, .card.shuffle, .card.done, .card.fly, .pest-guy, .pest-guy .bubble { transition: none; }
    .pest-guy.shuffling canvas { animation: none; }
    .ab-fly, .card.gone, .pest-card { transition: none; }

    #pg-title.drop { animation: none; }
    .card.done .in, .card.hint .back, .card.win, #h-moveschip.lost, .result-stars span, .pola, .book-leaf { animation: none; }
  }

  /* the letter, every time: the envelope arrives, the seal breaks, the flap opens, the letter rises,
     the envelope drops away and the letter unfolds; then the cake and the buttons */
  #end-env:not(.open) .env { animation: envIn .7s cubic-bezier(.2,1.4,.4,1) both, envbreath 2.4s ease-in-out .8s infinite; }
  @keyframes envIn { from { opacity: 0; transform: translateY(-60px) scale(.9); } }
  #end-env.open .env-seal { animation: sealBreak .4s ease-in forwards; }
  @keyframes sealBreak { 30% { transform: scale(1.35); } 100% { transform: scale(.2) rotate(40deg); opacity: 0; } }
  #end-env.open .env-flap { animation: envFlap .8s ease .25s both; }
  #end-env.open .env-letter { transition-delay: .9s; }
  #end-env .env-hint { transition: opacity .3s; }
  #end-env.open .env-hint { opacity: 0; }
  #end-env.out .env { transition: transform .6s ease-in, opacity .6s ease-in; }
  #end-env.out .env-back, #end-env.out .env-front, #end-env.out .env-flap { transition: transform .55s ease-in, opacity .5s; transform: translateY(70%); opacity: 0; }
  #end-env.out .env-letter { transition: transform .6s cubic-bezier(.3,0,.3,1), opacity .5s .1s; transform: translateY(-58%) scale(1.5); opacity: 0; }
  #ending.reveal .end-card { animation: unfold .8s cubic-bezier(.2,.9,.2,1) both; transform-origin: 50% 0; }
  @keyframes unfold { 0% { opacity: 0; transform: perspective(800px) rotateX(-75deg) scaleY(.4); } 60% { opacity: 1; } 100% { transform: none; } }
  #ending.lettered .end-card h2 { animation: writeIn .6s ease .1s both; }
  #ending.lettered .end-card p { animation: writeIn 1.1s ease .5s both; }
  #ending.lettered .end-card .sign { animation: writeIn .6s ease 1.5s both; }
  @keyframes writeIn { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
  @keyframes lineIn { from { opacity: 0; transform: translateY(8px); } }
  #ending.lettered #end-cake { animation: lineIn .6s ease 2s both; }
  #ending.lettered #end-stats, #ending.lettered #end-btns { animation: lineIn .5s ease 2.4s both; }
  @media (prefers-reduced-motion: reduce) {
    #end-env:not(.open) .env, #end-env.open .env-seal, #ending.lettered .end-card h2, #ending.lettered .end-card p, #ending.lettered .end-card .sign, #ending.lettered #end-cake, #ending.lettered #end-stats, #ending.lettered #end-btns, .ab.sealed, .ab.sealed .ab-shine, .ab-slot.on, .pest-guy .bubble .more { animation: none; }
  }

  /* the paper pocket on the Album's last page, with the envelope tucked in */
  .pocket { position: relative; width: min(78%, 250px); aspect-ratio: 3 / 2.3; margin: 14px auto 6px; }
  .pk-env { position: absolute; left: 7%; right: 7%; top: 0; aspect-ratio: 3 / 2; cursor: pointer; animation: pkPeek 2.4s ease-in-out infinite; outline: none; }
  .pk-env:focus-visible { outline: 3px solid var(--red); outline-offset: 4px; border-radius: 6px; }
  @keyframes pkPeek { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .pk-back { position: absolute; inset: 0; background: #d9b04f; border: 3px solid var(--paper-ink); border-radius: 5px; }
  .pk-paper { position: absolute; left: 9%; right: 9%; top: 8%; height: 70%; background: var(--paper); border: 2px solid var(--paper-ink); border-radius: 3px; }
  .pk-front, .pk-flap { position: absolute; left: 0; width: 100%; }
  .pk-front { top: 0; height: 100%; }
  .pk-front polygon { fill: #f2d27a; stroke: var(--paper-ink); stroke-width: 3; vector-effect: non-scaling-stroke; }
  .pk-flap { top: 0; height: 62%; }
  .pk-flap polygon { fill: #e6bf5c; stroke: var(--paper-ink); stroke-width: 3; vector-effect: non-scaling-stroke; }
  .pk-seal { position: absolute; left: 50%; top: 56%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--red); border: 3px solid var(--paper-ink); color: var(--paper); font-size: 12px; display: grid; place-items: center; animation: envseal 1.2s ease-in-out infinite; }
  .pk-front-pocket { position: absolute; left: 0; right: 0; bottom: 0; height: 52%; background: linear-gradient(180deg, #caa877, #b8935f); border: 3px solid var(--paper-ink); border-radius: 4px 4px 8px 8px; box-shadow: 0 -2px 0 rgba(255,255,255,.35) inset, 0 4px 0 rgba(42,26,46,.25); }
  .pk-tap { position: absolute; left: 0; right: 0; bottom: 18%; z-index: 1; text-align: center; font-family: var(--f-hand); font-weight: 700; font-size: 24px; line-height: 1; color: var(--paper-ink); animation: tapPulse 1.4s ease-in-out infinite; pointer-events: none; }
  @keyframes tapPulse { 50% { opacity: .45; transform: scale(.96); } }
  .pk-front-pocket::before { content: ""; position: absolute; inset: 6px 8px; border: 2px dashed rgba(42,26,46,.3); border-radius: 3px; }
  .pk-env.pull { animation: pkPull .52s cubic-bezier(.3,.7,.3,1) forwards; z-index: 2; }
  @keyframes pkPull { 0% { transform: translateY(0); } 60% { transform: translateY(-62%) scale(1.06); } 100% { transform: translateY(-58%) scale(1.04); } }
  /* the letter screen fades in; when it comes from the Album it skips the waiting and the hint */
  #ending { animation: endFade .35s ease both; }
  @keyframes endFade { from { opacity: 0; } }
  #ending.from #end-env .env { animation: none; }
  #ending.from:not(.landed) .env-hint { opacity: 0; }
  #ending.from.landed #end-env:not(.open) .env { animation: envbreath 2.4s ease-in-out infinite; }
  /* smoother opening */
  #end-env.open .env-flap { animation: envFlap .75s cubic-bezier(.45,0,.3,1) .22s both; }
  #end-env.open .env-letter { transition: transform .9s cubic-bezier(.25,.8,.25,1) .8s; }
  #end-env.open .env { animation: envOpenBob 1.6s ease-in-out both; }
  @keyframes envOpenBob { 0% { transform: scale(1); } 15% { transform: scale(.96); } 30% { transform: scale(1.04); } 100% { transform: scale(1.04); } }
  #end-env.out .env-back, #end-env.out .env-front, #end-env.out .env-flap { transition: transform .5s cubic-bezier(.5,0,.8,.4), opacity .4s ease .1s; transform: translateY(85%); opacity: 0; }
  /* the paper leaving the envelope and zooming to the card */
  .letter-morph { position: fixed; z-index: 60; background: var(--paper); border-radius: 6px; box-shadow: 0 0 0 3px var(--paper-ink), 8px 8px 0 var(--coral); pointer-events: none;
    background-image: linear-gradient(#c9b89c, #c9b89c), linear-gradient(#c9b89c, #c9b89c), linear-gradient(#c9b89c, #c9b89c); background-repeat: no-repeat;
    background-size: 70% 3px, 58% 3px, 44% 3px; background-position: 15% 22%, 15% 38%, 15% 54%; }
  #ending.reveal .end-card { animation: none; }
  #ending.reveal:not(.lettered) .end-card > *, #ending.reveal:not(.lettered) #end-cake, #ending.reveal:not(.lettered) #end-stats, #ending.reveal:not(.lettered) #end-btns { opacity: 0; animation: none; }
  @media (prefers-reduced-motion: reduce) { .pk-tap, .pk-env, .pk-seal, .pk-env.pull, #ending, #end-env.open .env { animation: none; } }

  /* scene change: a black circle closes, the chapter's name shows, the circle opens */
  #iris { position: fixed; inset: 0; z-index: 80; pointer-events: auto; display: grid; place-items: center; }
  #iris .iris-hole { position: absolute; left: 50%; top: 50%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; border-radius: 50%; box-shadow: 0 0 0 200vmax #0b0816; }
  #iris.close .iris-hole { animation: irisClose .65s cubic-bezier(.6,0,.4,1) forwards; }
  #iris.title .iris-hole { width: 0; height: 0; margin: 0; animation: none; }
  #iris.open .iris-hole { animation: irisOpen .65s cubic-bezier(.6,0,.4,1) forwards; }
  @keyframes irisClose { from { width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; } to { width: 0; height: 0; margin: 0; } }
  @keyframes irisOpen { from { width: 0; height: 0; margin: 0; } to { width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; } }
  #iris .iris-t { position: relative; z-index: 1; opacity: 0; text-align: center; font-family: var(--f-hand); font-weight: 700; font-size: 44px; line-height: 1; color: var(--paper); transition: opacity .25s; }
  #iris .iris-t small { display: block; margin-bottom: 6px; font-family: var(--f-body); font-weight: 400; font-size: 20px; letter-spacing: .12em; text-transform: uppercase; color: var(--lemon); }
  #iris.title .iris-t { opacity: 1; animation: irisT .45s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes irisT { from { transform: translateY(10px) scale(.94); } }
  /* the villain's warning: the light dims, the face-down cards shiver */
  #pest { transition: background-color .5s; }
  #pest.dim { background-color: rgba(10,7,22,.35); }
  .card.shiver { animation: shiver .12s linear 5; }
  @keyframes shiver { 25% { transform: translateX(-2px) rotate(-1deg); } 75% { transform: translateX(2px) rotate(1deg); } }
  /* the letter: one line after another */
  .end-card p .ln { display: block; }
  @keyframes writeLine { from { clip-path: inset(0 100% 0 0); opacity: .2; } 8% { opacity: 1; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
  #ending.lettered .end-card p { animation: none; }
  @media (prefers-reduced-motion: reduce) { #iris .iris-hole, .card.shiver { animation: none; } }
  #iris[hidden] { display: none; }

  /* ---------- after the story ---------- */
  #h-time { font-variant-numeric: tabular-nums; }
  /* the Album's extra page: the missing photo */
  .album-extra { align-items: center; text-align: center; }
  .album-extra .sec-head { align-self: stretch; }
  /* the guided tap: only the target is lit */
  .spot-blk { position: fixed; inset: 0; z-index: 70; }
  .spot-hole { position: fixed; border-radius: 10px; pointer-events: none; box-shadow: 0 0 0 200vmax rgba(10,7,22,.74), 0 0 0 3px var(--lemon), 0 0 18px 6px rgba(255,216,74,.5); animation: spotPulse 1.2s ease-in-out infinite; }
  @keyframes spotPulse { 50% { box-shadow: 0 0 0 200vmax rgba(10,7,22,.74), 0 0 0 5px var(--lemon), 0 0 28px 10px rgba(255,216,74,.7); } }
  .spot-hole.nudge { animation: spotNudge .35s ease; }
  @keyframes spotNudge { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .spot-tip { position: fixed; transform: translateX(-50%); background: var(--lemon); color: var(--paper-ink); font-family: var(--f-display); font-weight: 700; font-size: 17px; padding: 8px 14px; border-radius: 10px; box-shadow: 0 0 0 3px var(--paper-ink), 0 4px 0 3px var(--paper-ink); pointer-events: none; white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .spot-hole, .spot-hole.nudge { animation: none; } }
  /* lists and panels scroll only up and down: no sideways dragging */
  #menu, #menu .panel { overflow-x: hidden; touch-action: pan-y; overscroll-behavior: contain; }
  .album-extra.fresh { animation: exIn .9s cubic-bezier(.2,1.3,.4,1) .3s both; }
  @keyframes exIn { from { opacity: 0; transform: translateY(24px) scale(.96); } }
  .panel.shake { animation: albumShake .5s ease .35s; }
  @keyframes albumShake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
  .ex-frame { width: min(62%, 220px); background: #fff; border: 0; padding: 6px 6px 10px; box-shadow: 0 0 0 2px var(--paper-ink), 0 4px 0 #c9b89c; transform: rotate(-2deg); display: flex; flex-direction: column; gap: 6px; cursor: pointer; position: relative; }
  .ex-frame canvas { width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; display: block; }
  .ex-frame span { font-size: 14px; font-weight: 700; color: var(--paper-ink); }
  .ex-frame:not(.got) { background: #f6efe0; box-shadow: 0 0 0 2px var(--paper-ink), 0 4px 0 #c9b89c; }
  .ex-frame:not(.got) span { position: absolute; left: 0; right: 0; top: 30%; font-family: var(--f-hand); font-size: 56px; color: var(--lemon); line-height: 1; animation: tapPulse 1.6s ease-in-out infinite; }
  .ex-sub { margin: 0; color: var(--ink-dim); font-size: 15px; }
  .ex-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-self: stretch; }
  /* the challenges */
  .ch-bar { height: 12px; border-radius: 6px; background: rgba(255,246,224,.12); box-shadow: inset 0 0 0 2px var(--line); overflow: hidden; }
  .ch-bar i { display: block; height: 100%; background: var(--lemon); }
  .ch-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .ch-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(255,246,224,.06); box-shadow: inset 0 0 0 2px var(--line); font-size: 15px; line-height: 1.15; }
  .ch-list li.ok { background: rgba(255,216,74,.12); box-shadow: inset 0 0 0 2px var(--lemon); }
  .ch-stamp { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px dashed var(--line); color: var(--paper-ink); font-size: 16px; }
  .ch-list li.ok .ch-stamp { border: 2px solid var(--paper-ink); background: var(--lemon); transform: rotate(-12deg); }
  .ch-rec { margin: 0; text-align: center; color: var(--ink-dim); font-size: 14px; }
  .ch-rec b { color: var(--ink); }
  .st i, .rev-best .st i { font-style: normal; color: var(--line); }
  /* the Rivincita's results */
  .rev-rec { margin: 0; text-align: center; font-family: var(--f-hand); font-weight: 700; font-size: 30px; color: var(--lemon); animation: stampIn2 .45s cubic-bezier(.3,1.6,.5,1) .5s both; }
  @keyframes stampIn2 { from { opacity: 0; transform: scale(1.8) rotate(-8deg); } to { transform: rotate(-3deg); } }
  .rev-best { display: flex; justify-content: center; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 10px; border-radius: 10px; background: rgba(255,246,224,.06); box-shadow: inset 0 0 0 2px var(--line); font-size: 14px; color: var(--ink-dim); }
  .rev-best b { color: var(--ink); font-family: var(--f-num); }
  .rev-best .st { color: var(--lemon); font-size: 18px; }
  .rev-goal { margin: 0; text-align: center; font-family: var(--f-hand); font-size: 24px; color: var(--paper); }
  @media (prefers-reduced-motion: reduce) { .album-extra.fresh, .panel.shake, .ex-frame span, .rev-rec { animation: none; } }

  #dlg-shield { position: absolute; inset: 0; z-index: 39; }
  #dlg-shield[hidden] { display: none; }
  /* the guastafeste's note where the photo should be */
  .ex-frame.stolen { background: #f6efe0; }
  .ex-frame.stolen .ex-note { position: absolute; left: 14%; right: 14%; top: 18%; padding: 10px 8px; background: #d9d6e0; color: #2a2d36; border: 2px solid #2a2d36; border-radius: 3px; transform: rotate(4deg); box-shadow: 3px 3px 0 rgba(42,26,46,.3); font-family: var(--f-hand); font-size: 22px; line-height: 1; text-align: center; animation: noteSway 2.6s ease-in-out infinite; }
  .ex-frame.stolen .ex-note::before { content: ""; position: absolute; left: 50%; top: -6px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--red); border: 2px solid #2a2d36; }
  @keyframes noteSway { 50% { transform: rotate(1deg) translateY(-2px); } }
  .ex-btns.one { grid-template-columns: 1fr; }
  .ex-btns .free-cta { padding: 16px; font-size: 22px; }
  .panel > .row.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .panel > .row.row3 .btn { white-space: nowrap; padding-left: 6px; padding-right: 6px; min-width: 0; }
  @media (max-width: 380px) { .panel > .row.row3 .btn { font-size: 15px; padding-left: 4px; padding-right: 4px; } }
  .free-pick { max-width: 360px; }
  .free-pick .col { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 14px; }
  .free-pick .btn.size { display: flex; justify-content: space-between; align-items: baseline; padding: 15px 18px; font-size: 21px; }
  .free-pick .btn.size span { font-size: 16px; opacity: .75; }
  .free-done { text-align: center; }
  .done-panel { text-align: center; max-width: 380px; }
  .done-panel h2 { line-height: 1.1; }
  .done-row { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .done-row .btn.primary { padding: 15px; font-size: 21px; }
  .free-moves { font-size: 22px; margin: 6px 0 16px; color: var(--ink); }
  .free-moves b { font-family: var(--f-num); color: var(--lemon); font-size: 34px; }
  .album-head h2 small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 18px; color: var(--ink-dim); margin-top: 2px; }
  /* «Le sfide» + «del Consulente Grigio»: same handwriting, in yellow, a little smaller */
  .ch-panel .album-head h2 small { font-family: var(--f-hand); font-weight: 700; font-size: 25px; line-height: 1; color: var(--lemon); margin-top: 0; }
  .ch-list li .ch-t { flex: 1; }
  .ch-go { flex: none; padding: 7px 12px; font-size: 13px; }
  .test-btn { background: var(--coral); color: var(--paper-ink); }
  @media (prefers-reduced-motion: reduce) { .ex-frame.stolen .ex-note { animation: none; } }
</style>
</head>

const SPRITE_CACHE = {};
function rowsToCanvas(rows, map, scale = 1) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const cv = document.createElement('canvas'); cv.width = w * scale; cv.height = h * scale;
  const cx = cv.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) {
    const ch = rows[y][x]; if (ch === '.') continue;
    cx.fillStyle = (map && map[ch]) || PAL[ch] || '#ff00ff';
    cx.fillRect(x * scale, y * scale, scale, scale);
  }
  return cv;
}
function flipCanvas(cv) {
  const f = document.createElement('canvas'); f.width = cv.width; f.height = cv.height;
  const c = f.getContext('2d'); c.translate(cv.width, 0); c.scale(-1, 1); c.drawImage(cv, 0, 0); return f;
}
function outlineCanvas(cv, color = '#1a1024') {
  const o = document.createElement('canvas'); o.width = cv.width + 2; o.height = cv.height + 2;
  const c = o.getContext('2d');
  const tint = document.createElement('canvas'); tint.width = cv.width; tint.height = cv.height;
  const t = tint.getContext('2d'); t.drawImage(cv, 0, 0); t.globalCompositeOperation = 'source-in'; t.fillStyle = color; t.fillRect(0, 0, cv.width, cv.height);
  [[0, 1], [2, 1], [1, 0], [1, 2]].forEach(([dx, dy]) => c.drawImage(tint, dx, dy));
  c.drawImage(cv, 1, 1); return o;
}

// Character frames: dir in down/up/left/right, frame stand/a/b
// Jewellery bought at Skiathos is drawn on El Falcon (no gameplay effect)
function jewelKey() { return (typeof window !== 'undefined' && window.VG_JEWELS) || ''; }
function wearJewels(rows, view, jk) {
  if (!jk) return rows;
  const r = rows.map(s => s.split(''));
  const set = (x, y, ch) => { if (r[y] && r[y][x] !== undefined && r[y][x] !== '.') r[y][x] = ch; };
  if (view === 'down') {
    if (jk.includes('o')) { set(3, 7, 'U'); set(10, 7, 'U'); }
    if (jk.includes('c')) { for (let x = 4; x <= 9; x++) set(x, 9, 'w'); set(6, 10, 'U'); set(7, 10, 'U'); }
    if (jk.includes('b')) set(11, 11, 'U');
  } else if (view === 'side') {
    if (jk.includes('o')) set(8, 8, 'U');
    if (jk.includes('c')) for (let x = 6; x <= 9; x++) set(x, 9, 'w');
    if (jk.includes('b')) set(10, 11, 'U');
  } else if (view === 'up') {
    if (jk.includes('b')) set(11, 11, 'U');
  }
  return r.map(a => a.join(''));
}
function charFrames(kind) {
  const jk = kind === 'falcon' ? jewelKey() : '';
  const key = 'char_' + kind + jk; if (SPRITE_CACHE[key]) return SPRITE_CACHE[key];
  const H = kind === 'falcon' ? { down: wearJewels(FALCON_HEAD_DOWN, 'down', jk), up: wearJewels(FALCON_HEAD_UP, 'up', jk), side: wearJewels(FALCON_HEAD_SIDE, 'side', jk) } : { down: CROCCO_HEAD_DOWN, up: CROCCO_HEAD_UP, side: CROCCO_HEAD_SIDE };
  const LF = kind === 'falcon' ? LEGS_FRONT : CLEGS_FRONT, LS = kind === 'falcon' ? LEGS_SIDE : CLEGS_SIDE;
  const out = {};
  for (const f of ['stand', 'a', 'b']) {
    out['down_' + f] = outlineCanvas(rowsToCanvas([...H.down, ...LF[f]]));
    out['up_' + f] = outlineCanvas(rowsToCanvas([...H.up, ...LF[f]]));
    const r = outlineCanvas(rowsToCanvas([...H.side, ...LS[f]]));
    out['right_' + f] = r; out['left_' + f] = flipCanvas(r);
  }
  SPRITE_CACHE[key] = out; return out;
}
function humanoidSprite(id, o, scale = 1) {
  const key = 'hum_' + id + '_' + scale; if (SPRITE_CACHE[key]) return SPRITE_CACHE[key];
  const hm = humanoid(o);
  const base = outlineCanvas(rowsToCanvas(hm.rows, hm.map, scale));
  const walk = hm.rows.slice(); walk[13] = '..LLL..nnn..'; walk[14] = '..nnn.......'; walk[15] = '............';
  const walkC = outlineCanvas(rowsToCanvas(walk, hm.map, scale));
  const r = { down_stand: base, down_a: walkC, right: base, left: flipCanvas(base), a: walkC, aL: flipCanvas(walkC) };
  SPRITE_CACHE[key] = r; return r;
}
function customSpriteFlip(name) {
  const key = 'cf_' + name; if (SPRITE_CACHE[key]) return SPRITE_CACHE[key];
  return (SPRITE_CACHE[key] = flipCanvas(customSprite(name)));
}
function customSprite(name, scale = 1, outline = true) {
  const key = 'c_' + name + '_' + scale + outline; if (SPRITE_CACHE[key]) return SPRITE_CACHE[key];
  const d = CUSTOM[name];
  let cv = rowsToCanvas(d.rows, d.map, scale);
  if (outline) cv = outlineCanvas(cv);
  SPRITE_CACHE[key] = cv; return cv;
}

/* catalogo/guastafeste.js

   rappresentata da una persona, come il Lunedì) si fa invece con il disegnatore del sito, scrivendo le sue scelte
   nell'ordine. Regole, uguali al disegnatore: griglia 14×22 (16×24 con il contorno), contorno #1a1024, colori pieni
   con una luce e un'ombra, occhi alla distanza di quelli dei personaggi, due pose: «stand» (ferma) e «a» (passo).
   Ogni guastafeste nuovo resta qui e si può riusare. Nell'ordine: "aspetto": "<nome>". */
const GUASTAFESTE = (() => {
  const SW = 14, SH = 22, OUT = '#1a1024';
  function raster(rows, pal) {
    rows = rows.slice(); while (rows.length < SH) rows.unshift('.'.repeat(SW));
    const c = document.createElement('canvas'); c.width = SW + 2; c.height = SH + 2;
    const x = c.getContext('2d'), at = (i, y) => y >= 0 && y < SH && i >= 0 && i < SW && rows[y][i] !== '.';
    x.fillStyle = OUT;
    for (let y = 0; y < SH; y++) for (let i = 0; i < SW; i++) if (at(i, y)) [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dx, dy]) => { if (!at(i + dx, y + dy)) x.fillRect(i + dx + 1, y + dy + 1, 1, 1); });
    for (let y = 0; y < SH; y++) for (let i = 0; i < SW; i++) if (at(i, y)) { x.fillStyle = pal[rows[y][i]] || '#ff00ff'; x.fillRect(i + 1, y + 1, 1, 1); }
    return c;
  }
  const DIS = {
    // la sveglia: le lancette sono le sopracciglia arrabbiate, il sorriso dispettoso, il martelletto tra le campanelle;
    // nel passo le campanelle si allargano (sta suonando)

        '.RWWWKWWKWWWR.',
        '.RWWKWWWWKWWR.',
        '.RWWWWWWWWWWR.',
        'LRWWMTTTTMWWRL',
        'GRWWWMMMMWWWRG',

        '..RRWwwwwWRr..',

      stand: [
        '......BB..PGwe',
        '.....bBBb.PGwe',
        '......PP..P...',
        '.....RRRR.P...',
        '...RRRRRRRR...',
        '.RRRRRRRRRRRR.',
        'rrrrrrrrrrrrrr',
        '.YYYYYYYYYYYy.',
        '.YKKYYYYYYKKy.',
        '.YYYKYYYYKYYy.',
        '.YWWWYYYYWWWy.',
        'LYWKWYYYYWKWyL',
        'LYWWWYYYYWWWyL',
        'gYYDYYYYYYDYyg',
        '.YYDTTTTTTDYy.',
        '.YYYDDDDDDYYy.',
        '.yyyyyyyyyyyy.',
        '...LL....LL...',
        '...LL....LL...',
        '..nnn...nnn...'
      ],
      a: [

  function drawPlace(dt) {

    const sayTap = txt => new Promise(r => {
      byId('pest-sr').textContent = PEST.name + ': ' + txt;
      bub.innerHTML = '<span class="t"></span><i class="more" aria-hidden="true">▼</i>'; bub.classList.add('on');
      const t = bub.querySelector('.t'), more = bub.querySelector('.more'); more.hidden = true;
      let i = 0, typing = true, iv = 0;
      const finish = () => { typing = false; clearInterval(iv); t.textContent = txt; more.hidden = false; };
      if (VG.REDUCED) finish(); else iv = setInterval(() => { i++; t.textContent = txt.slice(0, i); if (i % 2 === 0 && txt[i] !== ' ') Audio.sfx('text'); if (i >= txt.length) finish(); }, 24);
      const close = () => { stage.removeEventListener('pointerdown', onTap); window.removeEventListener('keydown', onKey, true); stage.classList.remove('tap'); bub.classList.remove('on'); };
      const next = () => { if (typing) { finish(); return; } close(); r(); };
      const onTap = e => { e.preventDefault(); next(); };
      const onKey = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); next(); } };
      stage.classList.add('tap'); stage.addEventListener('pointerdown', onTap); window.addEventListener('keydown', onKey, true);
      pestSkip = () => { clearInterval(iv); close(); r(); };
    });
    const done = () => { clearInterval(walkT); pestSkip = null; stage.hidden = true; stage.innerHTML = ''; stage.classList.remove('dim'); Audio.duck(1); G.deck.forEach(c => c.el.classList.remove('shiver')); };

    // 1. he walks in (the very first time with a name card, so it's clear who he is) and says what he is up to
    const intro = !save.pestSeen; save.pestSeen = true; persist();
    // a little warning first: the music drops, the light dims, the face-down cards shiver, footsteps
    Audio.duck(0.25); Audio.sfx('boss');
    stage.classList.add('dim');
    G.deck.filter(c => !c.done).forEach((c, k) => { c.el.style.animationDelay = (k % 5) * 40 + 'ms'; c.el.classList.add('shiver'); });
    await pw(700); if (sess !== G.sess) return done();
    for (let k = 0; k < 3; k++) { Audio.sfx('block'); await pw(220); if (sess !== G.sess) return done(); }
    G.deck.forEach(c => { c.el.classList.remove('shiver'); c.el.style.animationDelay = ''; });
    let card = null;
    // the first time his name card comes in first, alone, long enough to be read; it stays while he speaks
    if (intro) { card = el('div', 'pest-card', `<b>${PEST.name}</b><span>${PEST.tagline}</span>`); stage.appendChild(card); requestAnimationFrame(() => card.classList.add('on')); Audio.sfx('warn'); await pw(1300); if (sess !== G.sess) return done(); }
    else Audio.sfx('warn');
    guy.classList.add('in');
    await pw(650); if (sess !== G.sess) return done();
    walking = false; drawGuy();
    if (intro) { await pw(900); if (sess !== G.sess) return done(); }
    await sayTap(intro ? PEST.first : G.mode === 'rev' && G.pestN > 1 ? PEST.again : PEST.enter); if (sess !== G.sess) return done();
    if (card) { card.classList.remove('on'); card.classList.add('off'); }
    // 2. the face-down cards fly into his hands
    const down = G.deck.filter(c => !c.done);
    // the little deck is held up over his head, so it stays in sight
    const hand = () => { const r = cv.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top - 34 }; };
    // a tidy little deck: every card straight, stacked with a small step, like a real pack of cards
    const toHand = (c, h, i) => { const r = c.el.getBoundingClientRect(); return `translate(${h.x - (r.left + r.width / 2) + (i % 3)}px, ${h.y - (r.top + r.height / 2) - i * 1.2}px) scale(.42)`; };
    let h = hand();
    down.forEach((c, i) => { c.el.classList.add('fly'); c.el.style.transitionDelay = (skipped ? 0 : i * 22) + 'ms'; c.el.style.transform = toHand(c, h, i); });
    Audio.sfx('dash');
    await pw(450 + down.length * 22); if (sess !== G.sess) return done();
    // 3. he shuffles: the little deck jumps in his hands
    guy.classList.add('shuffling'); Audio.sfx('chain');
    const order = shuffle(down.map(c => c.el));
    const placeholders = down.map(c => { const ph = document.createComment('slot'); grid.replaceChild(ph, c.el); return ph; });
    placeholders.forEach((ph, i) => grid.replaceChild(order[i], ph));
    // after the swap each card sits in its new slot: put it back in his hands without animating
    // (measure each new slot with no transform on, or the card would stay small in its slot)
    h = hand();
    down.forEach(c => { c.el.classList.remove('fly'); c.el.style.transitionDelay = '0ms'; c.el.style.transform = 'none'; c.seen = false; });
    void grid.offsetWidth;
    const back = down.map((c, i) => toHand(c, h, i));
    down.forEach((c, i) => { c.el.style.transform = back[i]; });
    void grid.offsetWidth;
    await pw(800); if (sess !== G.sess) return done();
    guy.classList.remove('shuffling');
    // 4. he deals them back, one by one, from the top of the deck: each flies straight and grows back
    const dealOrder = down.slice().reverse();
    dealOrder.forEach((c, i) => { c.el.classList.add('fly'); c.el.style.transitionDelay = (skipped ? 0 : i * 45) + 'ms'; c.el.style.transform = ''; });
    if (!skipped && !VG.REDUCED) dealOrder.forEach((c, i) => setTimeout(() => { if (sess === G.sess && i % 2 === 0) Audio.sfx('tap'); }, i * 45));
    await pw(450 + dealOrder.length * 45);
    down.forEach(c => { c.el.classList.remove('fly'); c.el.style.transitionDelay = ''; c.el.style.transform = ''; });
    if (sess !== G.sess) return done();
    // 5. a last word (a tap to go on), then he walks off and the game goes on
    await sayTap(PEST.leave); if (sess !== G.sess) return done();
    walking = true; guy.classList.add('out'); stage.classList.remove('dim'); Audio.duck(1);
    setTimeout(() => { if (stage.contains(guy)) done(); }, VG.REDUCED ? 100 : 900);
  }
  function hidePest() { if (pestSkip) pestSkip(); const st2 = byId('pest'); st2.hidden = true; st2.innerHTML = ''; }
  const sparks = [];
  function burst(elm) {
    const r = elm.getBoundingClientRect(), k = st.SCALE;
    for (let i = 0; i < 14; i++) sparks.push({ x: (r.left + r.width / 2) / k, y: (r.top + r.height / 2) / k, vx: rnd(-60, 60), vy: rnd(-80, 10), life: rnd(0.5, 0.9), c: pick(['#ffd84a', '#ff6b57', '#7cc6e8', '#f2a3b0', '#7fd18a']) });
  }
  function drawSparks(dt) {
    // sparks are drawn on the overlay so they sit above the background
    const c = st.fctx; if (!c) return;
    const k = st.SCALE * st.DPR;
    for (const p of sparks) { p.life -= dt; p.vy += 160 * dt; p.x += p.vx * dt; p.y += p.vy * dt; c.fillStyle = p.c; c.globalAlpha = clamp(p.life * 2, 0, 1); c.fillRect(Math.round(p.x) * k, Math.round(p.y) * k, 2 * k, 2 * k); }
    c.globalAlpha = 1;
    for (let i = sparks.length - 1; i >= 0; i--) if (sparks[i].life <= 0) sparks.splice(i, 1);
  }

  // TEST: finish the page at once (every pair found, no postcards), straight to the results
  function testWin() {
    if (!G.playing || VG.Dialog.open || G.found === G.pairs) return;
    G.sess++; closeMemo(); hidePest();
    G.deck.forEach(c => { c.el.classList.remove('fly', 'shuffle', 'hint'); c.el.style.transform = ''; c.el.style.transitionDelay = ''; });
    G.deck.forEach(c => { c.done = true; c.up = false; c.el.classList.add('done'); if (!c.isNew) c.el.classList.add('old'); });
    G.found = G.pairs; G.moves = Math.max(G.moves, G.pairs); G.open = []; hud();
    if (G.mode === 'rev') { finishRev(); return; }
    if (G.mode === 'free') { finishFree(); return; }
    CHAPTERS[G.page].cards.forEach(id => { save.got[id] = true; });

  // ---------------- end of a page ----------------
  // the page's three new memories as small polaroids with their notes

  // saved the moment the last pair is found, even if the player leaves before the results

    G.result = { stars, record, secs: Math.round((performance.now() - G.t0) / 1000) };
    save.stars[p] = Math.max(save.stars[p], stars); if (record) save.best[p] = G.moves;

  // a guided tap: the screen goes dark except the target, and only a tap on the target counts

        const b = target.getBoundingClientRect(), pad = 8;
        Object.assign(hole.style, { left: b.left - pad + 'px', top: b.top - pad + 'px', width: b.width + pad * 2 + 'px', height: b.height + pad * 2 + 'px' });
        tip.style.left = (b.left + b.width / 2) + 'px';
        const below = b.bottom + pad + 54 < innerHeight;
        tip.style.top = (below ? b.bottom + pad + 12 : b.top - pad - 48) + 'px';
      };
      place(); addEventListener('resize', place);
      const t0 = performance.now();
      blk.addEventListener('click', e => {
        if (performance.now() - t0 < 500) return;
        const b = target.getBoundingClientRect();

        { transform: `translate(${tx / 2}px, ${ty / 2 - 70}px) scale(${(s0 + 1) / 2 * 1.1}) rotate(-8deg)`, offset: 0.5 },
        { transform: 'translate(0,0) scale(1) rotate(-2deg)' }
      ], { duration: 1100, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
      await wait(1110);
      fill(); fly.remove(); if (sess !== G.sess) return;
    }
    Audio.sfx('ticket');
    conf = VG.confetti(60, st.VW, st.VH);
    await wait(D(1500)); if (sess !== G.sess) return;
    // the Album closes for good, with its seal
    ov.animate([{ backgroundColor: 'rgba(10,7,22,.62)' }, { backgroundColor: 'rgba(10,7,22,.86)' }], { duration: D(600), fill: 'forwards' });
    book.classList.add('closed'); Audio.sfx('door');
    const close = { duration: D(1300), easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' };
    book.animate([{ transform: 'none' }, { transform: CLOSED }], close);
    leaf.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(180deg)' }], close);
    const front = book.querySelector('.ab-front'), cover = book.querySelector('.ab-cover');
    setTimeout(() => { front.style.visibility = 'hidden'; cover.style.visibility = 'visible'; }, D(1300) / 2);
    await wait(D(1400)); if (sess !== G.sess) return;
    big.style.visibility = 'hidden';   // nothing of the inner page peeks out under the cover
    book.classList.add('sealed'); Audio.sfx('ticket');
    book.animate([{ transform: CLOSED }, { transform: 'translateX(-25%) scale(1.2, 1.09)', offset: .35 }, { transform: CLOSED }], { duration: D(450), easing: 'cubic-bezier(.3,1.6,.5,1)' });
    conf = VG.confetti(120, st.VW, st.VH);
    const done = ov.querySelector('.ab-done'); done.hidden = false;
    await wait(D(900)); if (sess !== G.sess) return;
    const b = el('button', 'btn primary', 'Torna ai Capitoli'); b.type = 'button';
    b.onclick = () => { ov.hidden = true; ov.innerHTML = ''; ov.classList.remove('final'); if (save.doneScreen) showAlbum(); else showCompleted(); };
    ov.querySelector('.ab-btns').appendChild(b); b.focus({ preventScroll: true });
    ov.appendChild(ptFoot());
  }
  function openCard(id) {
    const box = byId('menu'); box.innerHTML = '';
    const card = VG.postcardCard('x', { eyebrow: `Capitolo ${chapterOf(id) + 1}`, name: cardName(id), cap: cardCap(id), paint: cv => paint(cv, id), stampOn: false, develop: false, buttons: [{ label: 'Torna ai Capitoli', primary: true, onClick: () => showAlbum() }] });
    card.querySelector('.pc-no').textContent = `${COLLECTION.indexOf(id) + 1} di ${COLLECTION.length}`;
    box.appendChild(card); Audio.sfx('pick');
  }
  // ---------------- Playtale ----------------
  // the link to the Playtale site comes from the build (--playtale <url>); without it the line is not clickable
  const PT_URL = window.PT_URL || '', PT_ICON = document.querySelector('#pt-splash .pt-ic').src;
  const ptFoot = cls => { const f = el(PT_URL ? 'a' : 'div', 'pt-foot' + (cls ? ' ' + cls : ''), '<img alt="" src="' + PT_ICON + '"><span>Creato con Playtale · <b>Regala un Playtale' + (PT_URL ? ' ›' : '') + '</b></span>'); if (PT_URL) { f.href = PT_URL; f.target = '_blank'; f.rel = 'noopener'; } return f; };
  // «Playtale presenta»: about a second and a half when the page opens, a tap skips it
  (() => { const sp = byId('pt-splash'); let gone = false; const go = () => { if (gone) return; gone = true; sp.classList.add('out'); setTimeout(() => sp.remove(), 500); }; sp.addEventListener('pointerdown', go); setTimeout(go, window.__keepSplash ? 1e9 : 1700); })();
  // the first touch on the home turns the sound on (iPhone needs a touch before any sound)
  let titleTapped = false;
  byId('title').addEventListener('pointerdown', () => { if (titleTapped) return; titleTapped = true; Audio.unlock(); Audio.play('hub'); });
  function showTitle() {
    stopBoard(); hideMenu(); byId('title').hidden = false; byId('b-menu').hidden = true;
    bgMode = 'place'; G.page = 0;
    const en = byId('ending'); if (en) en.remove();
    const prog = hasProgress();
    byId('t-cont').hidden = !prog;
    byId('t-new').classList.toggle('primary', !prog);
    Audio.play('hub');
    fitHome(); requestAnimationFrame(fitHome);
  }
  // the home on a short screen (the game opened from a link, with the browser's bars): the album and the two of them
  // stay as big as the free height allows, instead of jumping to fixed smaller sizes
  function fitHome() {
    const t = byId('title'), stage = byId('t-stage'); if (!t || t.hidden || !stage) return;
    stage.style.zoom = 1;
    const cs = getComputedStyle(t), room = t.clientHeight - 2 * Math.max(52, parseFloat(cs.paddingTop), parseFloat(cs.paddingBottom)); // the content is centred: 52 px free above it for the Audio button
    const kids = [...t.children].filter(e => e.offsetParent), used = () => kids[kids.length - 1].getBoundingClientRect().bottom - kids[0].getBoundingClientRect().top;
    for (let i = 0; i < 3; i++) {
      const z = parseFloat(stage.style.zoom), over = used() - room; if (over <= 0) break;
      const h = stage.offsetHeight + parseFloat(getComputedStyle(stage).marginTop);
      stage.style.zoom = Math.max(0.55, z * (h * z - over) / (h * z)).toFixed(3);
    }
  }
  addEventListener('resize', fitHome);
  function paintTitle() {
    document.querySelector('.t-eyebrow').textContent = `${A.nome} & ${B.nome}`;
    document.querySelectorAll('.t-pol canvas').forEach((cv, i) => paint(cv, CHAPTERS[[1, 0, 3][i]].place));
    document.querySelectorAll('.t-hero').forEach(e => e.remove());
    const stg = byId('t-stage');
    [['f', VG.heroA('down')], ['k', VG.heroB('down')]].forEach(([k, img]) => {
      const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height; cv.getContext('2d').drawImage(img, 0, 0);
      cv.className = 't-hero ' + k; cv.style.width = img.width * 6 + 'px'; cv.style.height = img.height * 6 + 'px'; stg.appendChild(cv);
    });
  }


  // ---------------- loop ----------------
  let conf = [], last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    drawBg(dt);
    if (G.mode === 'rev' && G.playing && !G.lock && byId('menu').hidden) byId('h-time').textContent = '⏱ ' + clock(Math.max(0, playSecs()));
    if (conf.length) { VG.drawConfetti(st.ctx, conf, dt, T, st.VW, st.VH, false); conf = conf.filter(p => p.y < st.VH); }
    st.flushText();
    drawSparks(dt);
    requestAnimationFrame(frame);
  }

  // Continua: the first chapter not finished yet (all finished: the Album)
  byId('t-cont').onclick = () => { Audio.unlock(); const i = save.stars.findIndex(x => !x); if (i < 0) showAlbum(); else goToPage(i); };
  byId('t-new').onclick = () => { Audio.unlock(); if (hasProgress()) confirmNew(); else playIntro(); };
  byId('b-skip').onclick = () => skipIntro();
  byId('b-menu').onclick = () => showPause();
  byId('b-win').onclick = () => testWin();
  function confirmNew() {
    byId('title').hidden = true;
    const box = byId('menu'); box.innerHTML = ''; box.hidden = false;
    const panel = el('div', 'panel');
    panel.innerHTML = '<h2>Nuova partita?</h2><p class="sub">Si riparte dal capitolo 1. Capitoli, stelle, ricordi dell\'Album e lettera tornano da scoprire.</p>';
    const row = el('div', 'row');
    const yes = el('button', 'btn coral', 'Sì, ricomincia'); yes.type = 'button';
    yes.onclick = () => { const f = fresh(); Object.keys(save).forEach(k => delete save[k]); Object.assign(save, f); persist(); playIntro(); };
    const no = el('button', 'btn', 'No'); no.type = 'button'; no.onclick = showTitle;
    row.appendChild(no); row.appendChild(yes); panel.appendChild(row); box.appendChild(panel);
  }
  // no zoom on the phone: a double tap or a pinch must never enlarge the page (iPhone ignores the viewport rule)
  document.addEventListener('gesturestart', e => e.preventDefault());
  let lastTouch = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    // a quick second tap outside buttons and cards would zoom: stop it (taps on cards stay untouched, so two fast flips still work)
    if (now - lastTouch < 350 && !e.target.closest('button, .card, a, input')) e.preventDefault();
    lastTouch = now;
  }, { passive: false });
  VG.muteChip(byId('b-mute'));
  window.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!byId('memo').hidden) { closeMemo(); return; }
    if (G.playing) { if (byId('menu').hidden) showPause(); else resume(); }
  });
  paintTitle(); VG.fontsReady.then(() => { paintTitle(); fitHome(); });
  showTitle();
  requestAnimationFrame(frame);
  // hooks for automated runs / video recording
  window.MEM = {
    G, save, CHAPTERS, MISSIONS, meetVillain, finale, startPage, startRev, goToRev, showChallenges, openPhoto, checkMissions, playIntro, skipIntro, openLetter, flipAlbum, showMemo, closeMemo, assembleAlbum,
    solve: async (ms = 500) => {
      const ids = [...new Set(G.deck.filter(c => !c.done).map(c => c.id))];
      for (const id of ids) {
        const cs = G.deck.filter(c => c.id === id && !c.done); if (cs.length < 2) continue;
        while (G.lock) { if (!byId('memo').hidden) closeMemo(); if (VG.Dialog.open) VG.Dialog.advance(); await wait(50); if (!G.playing) return; }
        flip(cs[0]); flip(cs[1]); await wait(ms);
      }
    }
  };
})();
</script>
</body>
