<style>
/* Stile comune dei minigiochi di El Falcon e Il Crocco: stesso aspetto di Operazione Viaggettino
   (notte viola, limone, corallo, Pixelify Sans + VT323, pannelli con bordo chiaro e ombra piena). */
:root {
  --night: #1b1530; --night-2: #120e24; --panel: #2a2145; --panel-2: #352a58; --line: #4a3d78;
  --ink: #fff6e0; --ink-dim: #c9bfe0; --lemon: #ffd84a; --lemon-dk: #d9b21f; --coral: #ff6b57; --sea: #7cc6e8; --leaf: #7fd18a; --rose: #f2a3b0;
  --paper: #fff6e0; --paper-ink: #2a1a2e; --red: #c0392b;
  --f-display: "Pixelify Sans", "Courier New", monospace; --f-num: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif; --f-body: "VT323", "Courier New", monospace; --f-hand: "Caveat", "Comic Sans MS", cursive;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--night-2); color: var(--ink); overflow: hidden; overscroll-behavior: none; font-family: var(--f-display); -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
button, input { font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
#app { position: fixed; inset: 0; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; background: var(--night-2); }
canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
#cv { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
#fx { position: absolute; left: 0; top: 0; pointer-events: none; }
button { font-family: var(--f-display); color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--lemon); outline-offset: 2px; }

/* Top bar chips */
.topbar { position: absolute; top: calc(8px + var(--sat)); right: max(10px, var(--sar)); display: flex; gap: 6px; z-index: 30; }
.chip { background: rgba(18,14,36,.72); border: 2px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--ink); line-height: 1; }
.chip:active { background: var(--panel-2); }

/* Big buttons (title, panels) */
.btn { border: 3px solid var(--paper-ink); border-radius: 12px; padding: 13px 16px; font-size: 18px; font-weight: 700; background: var(--ink); color: var(--paper-ink); box-shadow: 0 5px 0 var(--paper-ink); line-height: 1.05; transition: transform .06s, box-shadow .06s; }
.btn.primary { background: var(--lemon); }
.btn.coral { background: var(--coral); }
.btn.leaf { background: var(--leaf); }
.btn.ghost { background: transparent; color: var(--ink-dim); border-color: var(--line); box-shadow: none; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--paper-ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 17px; opacity: .8; margin-top: 2px; }

/* Title screen */
.title { position: absolute; inset: 0; z-index: 20; overflow-y: auto; background: linear-gradient(180deg, #2a1f55 0%, #6a3a6e 48%, #e86a5a 78%, #ffb36b 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: calc(24px + var(--sat)) max(16px, var(--sar)) calc(24px + var(--sab)) max(16px, var(--sal)); text-align: center; }
.title::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 16%; background: repeating-linear-gradient(180deg, #2a2a6a 0 4px, #3a3a8a 4px 8px); opacity: .9; pointer-events: none; }
.t-eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--lemon); position: relative; z-index: 1; }
.t-name { margin: 0; font-size: clamp(34px, 10vw, 64px); line-height: .92; font-weight: 700; color: var(--ink); text-shadow: 3px 3px 0 var(--paper-ink), 6px 6px 0 rgba(0,0,0,.25); position: relative; z-index: 1; text-wrap: balance; }
.t-sub { margin: -4px 0 0; font-family: var(--f-body); font-size: 22px; line-height: 1.05; color: var(--ink); position: relative; z-index: 1; max-width: 340px; text-wrap: balance; }
.t-art { image-rendering: pixelated; position: relative; z-index: 1; }
.t-btns { display: flex; flex-direction: column; gap: 10px; width: min(100%, 300px); position: relative; z-index: 1; }
.t-foot { position: relative; z-index: 1; font-family: var(--f-body); font-size: 18px; color: var(--ink); opacity: .85; margin: 0; }

/* Dialog box (portrait + name + typewriter text) */
#dialog { position: absolute; left: max(10px, var(--sal)); right: max(10px, var(--sar)); bottom: calc(14px + var(--sab)); z-index: 40; max-width: 680px; margin: 0 auto; min-height: 112px; background: var(--panel); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 0 0 3px var(--night-2), 0 10px 30px rgba(0,0,0,.45); display: flex; gap: 12px; padding: 12px 14px 14px; cursor: pointer; }
#dialog[data-who="narr"] { background: #241c3d; border-color: var(--ink-dim); }
#dialog[data-who="narr"] #dlg-portrait { display: none; }
#dlg-portrait { width: 68px; height: 68px; flex: none; image-rendering: pixelated; background: var(--night); border-radius: 8px; border: 2px solid var(--line); align-self: flex-start; }
.dlg-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
#dlg-name { font-size: 14px; font-weight: 700; letter-spacing: .04em; }
#dlg-text { font-family: var(--f-body); font-size: 23px; line-height: 1.12; color: var(--ink); text-wrap: pretty; }
#dlg-more { position: absolute; right: 14px; bottom: 8px; color: var(--lemon); font-size: 12px; animation: bob .8s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }

/* Overlay + panel */
.overlay { position: absolute; inset: 0; z-index: 25; display: flex; align-items: center; justify-content: center; padding: calc(16px + var(--sat)) max(16px, var(--sar)) calc(16px + var(--sab)) max(16px, var(--sal)); background: rgba(10,7,22,.66); overflow-y: auto; }
.panel { width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; background: var(--panel); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 0 0 3px var(--night-2), 0 16px 40px rgba(0,0,0,.5); padding: 16px; display: flex; flex-direction: column; gap: 12px; margin: auto; }
.panel h2 { margin: 0; font-size: 24px; line-height: 1; }
.panel .sub { margin: -4px 0 0; font-family: var(--f-body); font-size: 20px; color: var(--ink-dim); line-height: 1.1; }
.panel .row { display: flex; gap: 8px; flex-wrap: wrap; }
.panel .row .btn { flex: 1; }

/* Toast */
#toast { position: absolute; left: 50%; top: calc(56px + var(--sat)); transform: translate(-50%, -6px); z-index: 45; pointer-events: none; background: var(--ink); color: var(--paper-ink); border-radius: 10px; padding: 7px 12px; font-family: var(--f-body); font-size: 21px; line-height: 1; max-width: calc(100% - 32px); text-align: center; opacity: 0; transition: opacity .2s, transform .25s cubic-bezier(.2,1.6,.4,1); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Paper note with a portrait ("Il Crocco: ...") on results panels */
.say-card { background: var(--paper); color: var(--paper-ink); border-radius: 14px; padding: 12px 14px; box-shadow: 0 0 0 3px var(--paper-ink); display: flex; gap: 12px; align-items: flex-start; }
.say-card canvas { width: 56px; height: 56px; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; background: var(--night); border-radius: 8px; border: 2px solid var(--paper-ink); }
.say-card p { margin: 0; font-family: var(--f-body); font-size: 22px; line-height: 1.08; text-wrap: pretty; }
.say-card b { display: block; font-family: var(--f-display); font-size: 13px; color: var(--red); margin-bottom: 2px; }
.panel .say-card { border-radius: 12px; padding: 10px 12px; }
.panel .say-card canvas { width: 48px; height: 48px; }
.panel .say-card p { font-size: 21px; line-height: 1.05; }

/* "Apri la lettera": the button with the red seal that leads to the ending */
.btn.letter { display: flex; align-items: center; justify-content: center; gap: 10px; animation: letterGlow 1.6s ease-in-out infinite; }
.btn.letter .seal { width: 24px; height: 24px; flex: none; border-radius: 50%; background: var(--red); color: var(--paper); border: 2px solid var(--paper-ink); display: grid; place-items: center; font-size: 12px; line-height: 1; }
@keyframes letterGlow { 50% { box-shadow: 0 5px 0 var(--paper-ink), 0 0 0 4px rgba(255,216,74,.45); } }
.panel .row .btn.letter { flex-basis: 100%; }

/* Text only for screen readers */
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Postcard card (paper, dashed margin, tilted photo, stamp) */
.pc-card { width: min(100%, 420px); margin: auto; background: var(--paper); color: var(--paper-ink); border-radius: 14px; padding: 14px 14px 14px 22px; position: relative; box-shadow: 0 0 0 3px var(--paper-ink), 8px 8px 0 var(--lemon); display: flex; flex-direction: column; gap: 8px; animation: pcin .45s cubic-bezier(.2,1.3,.4,1) both; }
.pc-card::before { content: ""; position: absolute; left: 9px; top: 12px; bottom: 12px; border-left: 3px dashed #c9b89c; }
@keyframes pcin { from { transform: translateY(30px) scale(.92) rotate(-2deg); opacity: 0; } to { transform: none; opacity: 1; } }
.pc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pc-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--red); }
.pc-no { font-family: var(--f-num); font-weight: 700; font-size: 14px; color: #8a7a6a; font-variant-numeric: tabular-nums; }
.pc-photo { position: relative; width: min(100%, 52vh); align-self: center; background: #fff; padding: 6px 6px 16px; box-shadow: 0 2px 0 #c9b89c, 0 0 0 1px #e3d8c4; transform: rotate(-1.2deg); }
.pc-photo canvas { display: block; width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; image-rendering: crisp-edges; }
.pc-stamp { position: absolute; right: -8px; bottom: -6px; transform: rotate(-12deg) scale(2.2); opacity: 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--red); border: 3px solid var(--red); border-radius: 8px; padding: 3px 8px; background: rgba(255,246,224,.85); }
.pc-stamp.on { opacity: 1; transform: rotate(-12deg) scale(1); transition: transform .22s cubic-bezier(.3,1.6,.5,1), opacity .1s; }
.pc-name { margin: 4px 0 0; font-size: clamp(24px, 7vw, 32px); line-height: 1; color: var(--paper-ink); text-wrap: balance; }
.pc-cap { margin: 0; font-family: var(--f-body); font-size: 22px; line-height: 1.1; color: #4a3a5a; text-wrap: pretty; }
.pc-stats { display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--f-num); font-weight: 700; font-size: 14px; color: #6a5a7a; font-variant-numeric: tabular-nums; }
.pc-stats b { color: var(--paper-ink); }
.pc-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pc-btns .btn { padding: 9px 14px; font-size: 15px; box-shadow: 0 3px 0 var(--paper-ink); }
.pc-btns .btn.ghost, .intro-card .btn.ghost { color: var(--paper-ink); border-color: #c9b89c; box-shadow: none; } /* readable on paper */
/* phone held sideways: photo on the left, words and buttons on the right, everything visible without scrolling */
@media (orientation: landscape) and (max-height: 500px) {
  .pc-card { display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr); grid-template-rows: auto auto auto auto 1fr; grid-template-areas: "top top" "photo name" "photo cap" "photo stats" "photo btns"; column-gap: 16px; row-gap: 6px; width: min(100%, 700px); align-items: start; }
  .pc-card .pc-top { grid-area: top; } .pc-card .pc-photo { grid-area: photo; width: 100%; align-self: start; }
  .pc-card .pc-name { grid-area: name; margin: 0; } .pc-card .pc-cap { grid-area: cap; font-size: 19px; line-height: 1.05; }
  .pc-card .pc-stats { grid-area: stats; } .pc-card .pc-btns { grid-area: btns; align-self: end; }
}

/* Ending: envelope, cake, card (copied look from Viaggettino) */
#ending { position: absolute; inset: 0; z-index: 50; overflow-y: auto; background: #2a1f45; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: calc(18px + var(--sat)) max(16px, var(--sar)) calc(28px + var(--sab)) max(16px, var(--sal)); }
#end-cake { width: min(100%, 520px); aspect-ratio: 260 / 140; image-rendering: pixelated; border: 3px solid var(--ink); border-radius: 12px; flex: none; }
.end-card { width: min(100%, 520px); background: var(--paper); color: var(--paper-ink); border-radius: 14px; padding: 20px 20px 18px; box-shadow: 0 0 0 3px var(--paper-ink), 8px 8px 0 var(--coral); }
.end-card h2 { margin: 0 0 10px; font-size: clamp(26px, 7vw, 40px); line-height: 1; color: var(--red); text-wrap: balance; }
.end-card p { margin: 0; font-family: var(--f-body); font-size: 25px; line-height: 1.12; text-wrap: pretty; }
.end-card .sign { margin-top: 12px; text-align: right; font-family: var(--f-display); font-size: 16px; font-weight: 700; }
#end-stats { width: min(100%, 520px); margin: 0; font-family: var(--f-body); font-size: 19px; color: var(--ink-dim); text-align: center; line-height: 1.1; }
#end-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
#ending.env-mode > :not(#end-env) { display: none; }
#end-env { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; min-height: 70vh; cursor: pointer; outline: none; }
#end-env:focus-visible .env { outline: 3px solid var(--lemon); outline-offset: 8px; border-radius: 8px; }
.env { position: relative; width: min(78vw, 320px); aspect-ratio: 3 / 2; perspective: 700px; }
.env-back { position: absolute; inset: 0; background: #d9b04f; border: 3px solid var(--paper-ink); border-radius: 6px; }
.env-letter { position: absolute; left: 9%; right: 9%; top: 8%; height: 80%; background: var(--paper); border: 3px solid var(--paper-ink); border-radius: 4px; padding: 12% 10% 0; display: flex; flex-direction: column; gap: 9%; z-index: 1; transition: transform 1s cubic-bezier(.2, .8, .2, 1) .75s; }
.env-letter i { display: block; height: 3px; background: #c9b89c; border-radius: 2px; }
.env-letter i:nth-child(2) { width: 82%; } .env-letter i:nth-child(3) { width: 64%; }
.env-letter b { margin-top: auto; margin-bottom: 10%; align-self: flex-end; font-family: var(--f-display); font-size: 13px; color: var(--red); }
.env-front { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
.env-front polygon { fill: #f2d27a; stroke: var(--paper-ink); stroke-width: 3; vector-effect: non-scaling-stroke; }
.env-flap { position: absolute; left: 0; right: 0; top: 0; height: 62%; z-index: 3; transform-origin: 50% 0; }
.env-flap svg { width: 100%; height: 100%; display: block; }
.env-flap polygon { fill: #e6bf5c; stroke: var(--paper-ink); stroke-width: 3; vector-effect: non-scaling-stroke; }
.env-seal { position: absolute; left: 50%; top: 86%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--red); border: 3px solid var(--paper-ink); box-shadow: inset 0 0 0 3px #e0574a; }
.env-seal::after { content: '♥'; position: absolute; inset: 0; display: grid; place-items: center; color: var(--paper); font-size: 12px; line-height: 1; }
#end-env.open .env-flap { animation: envFlap .8s ease forwards; }
#end-env.open .env-letter { transform: translateY(-58%); }
@keyframes envFlap { 0% { transform: rotateX(0); z-index: 3; } 49% { z-index: 3; } 50% { z-index: 0; } 100% { transform: rotateX(180deg); z-index: 0; } }
.env-hint { margin: 0; font-family: var(--f-display); font-size: 16px; color: var(--paper); letter-spacing: .02em; }

@keyframes cardIn { from { transform: translateY(40px) rotate(-2deg); opacity: 0; } to { transform: none; opacity: 1; } }

@keyframes envbreath { 50% { transform: scale(1.035); } }
@keyframes envseal { 50% { transform: scale(1.18); box-shadow: inset 0 0 0 3px #e0574a, 0 0 12px 4px rgba(255,107,87,.6); } }

/* "Gira il telefono" */
#rotate { position: absolute; inset: 0; z-index: 90; background: var(--night); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; }
#rotate canvas { width: 120px; height: 120px; image-rendering: pixelated; }
#rotate h2 { margin: 0; font-size: 26px; line-height: 1; }
#rotate p { margin: 0; font-family: var(--f-body); font-size: 22px; color: var(--ink-dim); line-height: 1.05; max-width: 280px; }

@media (prefers-reduced-motion: reduce) {

  .slot.empty { background: rgba(255,246,224,.08); box-shadow: 0 0 0 2px var(--line); color: var(--ink-dim); }
  .slot.empty canvas { opacity: .14; filter: grayscale(1) brightness(.3); }
  .album-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .album-head h2 { font-family: var(--f-hand); font-size: 36px; color: var(--lemon); font-weight: 700; }
  .album-head span { font-family: var(--f-num); font-weight: 700; color: var(--ink-dim); }
  .result-stars { font-size: 40px; letter-spacing: 4px; color: var(--lemon); text-align: center; line-height: 1; }
  .result-stars span { display: inline-block; animation: starIn .45s cubic-bezier(.2,1.8,.4,1) both; }
  .result-stars span.off { color: var(--line); }

  .stats { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; font-family: var(--f-num); font-weight: 700; font-size: 15px; color: var(--ink-dim); }
  .stats b { color: var(--ink); }

  /* the end of the game: all the photos fly into one Album, which closes */
  #assemble { position: absolute; inset: 0; z-index: 34; animation: abIn .6s ease both; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: calc(64px + var(--sat)) 16px calc(16px + var(--sab)); background: rgba(10,7,22,.62); }
  .ab { --w: min(460px, 96vw); position: relative; width: var(--w); height: calc(var(--w) * .66); display: flex; perspective: 1400px; }
  .ab-l, .ab-r { position: relative; width: 50%; height: 100%; }
  @keyframes abIn { from { background-color: transparent; } }

  .ab-r { background: repeating-linear-gradient(0deg, transparent 0 13px, rgba(166,124,82,.08) 13px 14px), linear-gradient(90deg, #e8d6ae 0, #fbefd2 9%, #fdf4dc 60%, #f3e3bd 100%); border-radius: 2px 8px 8px 2px; box-shadow: 0 0 0 3px var(--paper-ink), 2px 2px 0 1px #e9dcbc, 4px 4px 0 1px #d8c79f, 6px 6px 0 1px var(--paper-ink), 9px 11px 0 rgba(10,7,22,.4); }
  .ab-l, .ab-front, .ab-cover { will-change: transform; -webkit-transform: translateZ(0); }
  .ab-l { transform-origin: right center; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; z-index: 2; }
  .ab-front, .ab-cover { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .ab-front { background: repeating-linear-gradient(0deg, transparent 0 13px, rgba(166,124,82,.08) 13px 14px), linear-gradient(90deg, #f3e3bd 0, #fdf4dc 40%, #fbefd2 91%, #e8d6ae 100%); border-radius: 8px 2px 2px 8px; box-shadow: 0 0 0 3px var(--paper-ink), -2px 2px 0 1px #e9dcbc, -4px 4px 0 1px #d8c79f, -6px 6px 0 1px var(--paper-ink), -9px 11px 0 rgba(10,7,22,.4); }
  .ab-front::after { content: ""; position: absolute; right: 0; top: 4px; bottom: 4px; width: 14px; background: linear-gradient(90deg, transparent, rgba(42,26,46,.22)); pointer-events: none; }
  .ab-r::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 14px; background: linear-gradient(270deg, transparent, rgba(42,26,46,.22)); pointer-events: none; }
  .ab-slots { position: absolute; inset: 9% 9%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 7%; }
  .ab-slot { background: rgba(42,26,46,.07); border: 1.5px dashed rgba(42,26,46,.22); border-radius: 2px; transform: rotate(var(--rot)); }
  .ab-slot { position: relative; }
  .ab-slot.on { background: #fff; border: 0; padding: 2px 2px 5px; box-shadow: 0 0 0 1px #e3d8c4, 0 2px 0 #c9b89c, 0 3px 6px rgba(42,26,46,.18); animation: slotPop .35s cubic-bezier(.2,1.8,.4,1); }
  /* little black photo corners holding each picture */
  .ab-slot.on::before, .ab-slot.on::after, .ab-slot.on i::before, .ab-slot.on i::after { content: ""; position: absolute; width: 7px; height: 7px; background: #2a1a2e; }
  .ab-slot.on::before { left: -2px; top: -2px; clip-path: polygon(0 0, 100% 0, 0 100%); }
  .ab-slot.on::after { right: -2px; top: -2px; clip-path: polygon(0 0, 100% 0, 100% 100%); }
  .ab-slot.on i::before { left: -2px; bottom: -2px; clip-path: polygon(0 0, 0 100%, 100% 100%); }
  .ab-slot.on i::after { right: -2px; bottom: -2px; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  @keyframes slotPop { 0% { transform: rotate(var(--rot)) scale(1.25); } 100% { transform: rotate(var(--rot)) scale(1); } }
  .ab-slot canvas { display: block; width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; }
  .ab-fly { position: fixed; z-index: 2; background: #fff; padding: 4px 4px 9px; box-shadow: 0 0 0 1px #e3d8c4, 0 6px 14px rgba(10,7,22,.45); transform-origin: top left; transition: transform .6s cubic-bezier(.4,0,.2,1); }
  .ab-fly canvas { display: block; width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; }
  .ab-cover { visibility: hidden; transform: rotateY(180deg); border-radius: 3px 10px 10px 3px; overflow: hidden;
    background: radial-gradient(120% 90% at 30% 20%, rgba(255,255,255,.12), transparent 55%), repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 5px), linear-gradient(90deg, #7e2230 0, #9e2f3a 9%, #b8343c 12%, #b8343c 100%);
    box-shadow: 0 0 0 3px var(--paper-ink), 4px 5px 0 1px #fbefd2, 5px 6px 0 2px var(--paper-ink), 9px 11px 0 rgba(10,7,22,.45);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #fff3cf; text-align: center; }
  /* gold stitching and brass corners */
  .ab-cover::before { content: ""; position: absolute; inset: 9px 9px 9px 18px; border: 2px dashed rgba(255,216,74,.75); border-radius: 4px; pointer-events: none; }
  .ab-cover::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, #e7b84a 0 13px, transparent 13px) top left / 50% 50% no-repeat, linear-gradient(225deg, #e7b84a 0 13px, transparent 13px) top right / 50% 50% no-repeat, linear-gradient(45deg, #e7b84a 0 13px, transparent 13px) bottom left / 50% 50% no-repeat, linear-gradient(315deg, #e7b84a 0 13px, transparent 13px) bottom right / 50% 50% no-repeat; }
  .ab-emb { width: 44px; image-rendering: pixelated; filter: drop-shadow(0 2px 0 rgba(42,26,46,.5)); margin-left: 8px; }
  .ab-cover b { font-family: var(--f-hand); font-size: 44px; line-height: .9; color: #ffe6a0; text-shadow: 0 2px 0 #7e2230, 0 -1px 0 rgba(255,255,255,.35); margin-left: 8px; }
  .ab-cover .ab-n { font-family: var(--f-body); font-size: 18px; opacity: .9; margin-left: 8px; letter-spacing: .04em; }
  .ab-seal { z-index: 4; }
  /* the intro's Album: the same cover, floating over the scene */
  .ia { position: absolute; z-index: 6; pointer-events: none; transform-origin: 50% 50%; }
  .ia .ia-cover { visibility: visible; transform: none; -webkit-transform: none; will-change: auto; inset: 0; }
  .ia .ia-cover b { font-size: calc(var(--w) * .105); } .ia .ia-cover .ab-n { font-size: calc(var(--w) * .045); } .ia .ab-emb { width: calc(var(--w) * .1); }
  .ia .ia-back { position: absolute; inset: 0; border-radius: 10px 3px 3px 10px; background: repeating-linear-gradient(45deg, rgba(0,0,0,.06) 0 2px, transparent 2px 5px), linear-gradient(90deg, #8e2833, #6e1d26); box-shadow: 0 0 0 3px var(--paper-ink); display: none; }
  .ia.back .ia-back { display: block; } .ia.back .ia-cover, .ia.back .ab-rib { visibility: hidden; }
  .ia.shining .ab-shine { animation: shine 1.2s ease-out infinite; animation-delay: 1.4s; }
  .ia .ab-rib { bottom: -22px; z-index: -1; } /* behind the cover: it hangs out from under the pages, as in the Album */
  .ab-rib { position: absolute; z-index: 0; right: 13%; bottom: -16px; width: 12px; height: 34px; background: #e7b84a; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); box-shadow: inset -3px 0 0 rgba(0,0,0,.15); }
  /* a gleam passes over the cover once it is sealed */
  .ab.sealed .ab-cover { animation: none; }
  .ab.sealed .ab-rib { animation: ribbon 1.6s ease-in-out .2s; transform-origin: top center; }
  @keyframes ribbon { 30% { transform: rotate(6deg); } 60% { transform: rotate(-4deg); } }
  .ab-shine { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(255,246,224,.55) 48%, transparent 60%); transform: translateX(-120%); }
  .ab.sealed .ab-shine { animation: shine 1.1s ease-out .35s both; }
  @keyframes shine { to { transform: translateX(120%); } }
  .ab-seal { position: absolute; right: -12px; bottom: -12px; width: 46px; height: 46px; border-radius: 50%; background: #9e2f3a; box-shadow: 0 0 0 3px var(--paper-ink); display: grid; place-items: center; font-style: normal; font-size: 22px; color: var(--paper); opacity: 0; transform: scale(2.2) rotate(-20deg); }

  .ab { transform-origin: 75% 50%; }
  .ab-seal { transition: transform .25s ease, opacity .2s; }
  .ab.sealed .ab-seal { opacity: 1; transform: rotate(-12deg); transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .1s; }
  .ab-btns { display: flex; width: min(360px, 92vw); justify-content: center; margin-top: 14px; }
  /* the photo finale: twelve little memories on the left, the last photo big on the right */
  .ab-slots.mini { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 6%; inset: 8% 8%; }
  .ab-big { position: absolute; inset: 16% 11% 22%; border: 2px dashed rgba(42,26,46,.3); border-radius: 3px; display: grid; place-items: center; transform: rotate(-2deg); }
  .ab-big span { font-family: var(--f-hand); font-weight: 700; font-size: 20px; color: rgba(42,26,46,.45); }
  .ab-big.on { overflow: hidden; border: 0; background: #fff; padding: 5px 5px 0; box-shadow: 0 0 0 1px #e3d8c4, 0 4px 10px rgba(10,7,22,.35); display: flex; flex-direction: column; gap: 3px; }
  .ab-big canvas { width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; display: block; }
  .ab-big b { font-family: var(--f-hand); font-size: 18px; color: var(--paper-ink); text-align: center; line-height: 1.1; }
  .ab-done { margin: 34px 0 0; font-family: var(--f-hand); font-weight: 700; font-size: 44px; line-height: 1; color: var(--lemon); text-shadow: 3px 3px 0 var(--paper-ink); animation: doneIn .6s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes doneIn { from { opacity: 0; transform: scale(.6) rotate(-4deg); } }
  @media (prefers-reduced-motion: reduce) { .ab-done { animation: none; } }
  /* «Sfoglia l'Album»: the page of the last photo */
  .bp-photo { width: min(78%, 300px); margin: 6px auto 4px; background: #fff; padding: 7px 7px 12px; box-shadow: 0 0 0 2px var(--paper-ink), 0 4px 0 #c9b89c; transform: rotate(-2deg); }
  .bp-photo canvas { display: block; width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; }
  .ab-btns .btn { flex: 1; max-width: 300px; }

  /* polaroids with their notes: end of a page and the Album leafing through */
  .sheet { background: var(--paper); border-radius: 10px; padding: 10px 12px 12px; box-shadow: 0 0 0 3px var(--paper-ink); color: var(--paper-ink); }
  .sheet-h { margin: 0 0 8px; font-family: var(--f-hand); font-weight: 700; font-size: 22px; line-height: 1; color: var(--red); }
  .polas { display: flex; flex-direction: column; gap: 10px; }
  .pola { display: grid; grid-template-columns: 34% 1fr; gap: 10px; align-items: center; animation: polaIn .45s cubic-bezier(.2,1.4,.4,1) both; }
  .pola .ph { background: #fff; padding: 4px 4px 10px; box-shadow: 0 0 0 1px #e3d8c4, 0 3px 0 #c9b89c; transform: rotate(var(--rot)); position: relative; }
  .pola .ph::after { content: ""; position: absolute; top: -6px; left: 50%; width: 46%; height: 11px; transform: translateX(-50%) rotate(-4deg); background: rgba(255,232,150,.72); }
  .pola canvas { display: block; width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; image-rendering: crisp-edges; }
  .pola b { display: block; font-size: 15px; line-height: 1; color: var(--paper-ink); }
  .pola p { margin: 2px 0 0; font-family: var(--f-body); font-size: 18px; line-height: 1.02; color: #4a3a5a; text-wrap: pretty; }
  @keyframes polaIn { from { opacity: 0; transform: translateY(10px) scale(.96); } }
  .page-done { gap: 10px; }
  /* on short screens the panel scrolls, but its buttons stay in sight */
  .pd-row.pd-row-none { display: none; }
  .done-pick { max-width: 600px; text-align: center; }
  .done-pick h2 { font-size: clamp(22px, 3.6vw, 28px); color: var(--lemon); white-space: nowrap; }
  .done-pick .sub { font-size: 17px; line-height: 1.3; margin: 8px 0 14px; }
  .done-pick .done-row { display: flex; gap: 10px; flex-wrap: nowrap; }
  .done-pick .done-row .btn { flex: 1; }
  .done-pick .done-row .btn.primary { flex: 1.4; }
  .ah-stars b { color: var(--lemon); }
  .page-done > .row, .ch-panel > .row { position: sticky; bottom: -16px; margin: 0 -16px -16px; padding: 10px 16px 16px; background: var(--panel); box-shadow: 0 -10px 12px -6px rgba(10,7,22,.5); z-index: 1; }
  .page-done .pola { grid-template-columns: 30% 1fr; }
  .row.next-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row.next-row .btn.wide { grid-column: 1 / -1; padding: 15px 16px; font-size: 20px; }
  .page-done .pola p { font-size: 17px; }
  .book { width: 100%; max-width: 440px; margin: auto; display: flex; flex-direction: column; gap: 12px; }
  .book-page { background: repeating-linear-gradient(0deg, transparent 0 17px, rgba(166,124,82,.07) 17px 18px), linear-gradient(90deg, #ead9b2 0, #fdf4dc 6%, #fbefd2 85%, #f1e0bb 100%); color: var(--paper-ink); border-radius: 6px 14px 14px 6px; box-shadow: 0 0 0 3px var(--paper-ink), 3px 3px 0 1px #e9dcbc, 6px 6px 0 1px #d8c79f, 8px 8px 0 1px var(--paper-ink), 12px 13px 0 rgba(10,7,22,.4); padding: 14px 16px 16px 22px; position: relative; transform-origin: left center; min-height: 320px; }
  .book-page::before { content: ""; position: absolute; left: 9px; top: 12px; bottom: 12px; border-left: 3px dashed #c9b89c; }
  .book-stage { position: relative; }
  .book-leaf { position: absolute; left: 0; top: 0; width: 100%; z-index: 3; transform-origin: left center; animation: leaf .75s cubic-bezier(.45,.05,.35,1) both; pointer-events: none; }
  /* the turning page and everything on it vanish together once it is edge-on (photos included) */
  .book-leaf * { animation: none !important; }
  /* the Album open: the arrows at the sides of the page, the dots under it, «Chiudi» in the corner */
  .overlay.book-ov { background: rgba(10,7,22,.86); overflow: hidden; overscroll-behavior: none; touch-action: none; }
  .overlay.book-ov .book-stage { touch-action: none; }
  .book { flex-direction: row; align-items: center; gap: 14px; position: relative; }
  .bk-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .bk-nav { flex: none; width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--paper-ink); background: var(--lemon); color: var(--paper-ink); box-shadow: 0 4px 0 var(--paper-ink); font-family: var(--f-num); font-size: 34px; font-weight: 700; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0 0 5px; cursor: pointer; }
  .bk-nav.bk-prev { background: var(--paper); }
  .bk-nav:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--paper-ink); }

  .book-h { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--red); }
  .book-page h2 { margin: 2px 0 12px; font-family: var(--f-hand); font-size: 38px; line-height: .95; font-weight: 700; color: var(--paper-ink); }

    .pest-guy.shuffling canvas { animation: none; }

  }

  /* the letter, every time: the envelope arrives, the seal breaks, the flap opens, the letter rises,
     the envelope drops away and the letter unfolds; then the cake and the buttons */
  #end-env:not(.open) .env { animation: envIn .7s cubic-bezier(.2,1.4,.4,1) both, envbreath 2.4s ease-in-out .8s infinite; }
  @keyframes envIn { from { opacity: 0; transform: translateY(-60px) scale(.9); } }
  #end-env.open .env-seal { animation: sealBreak .4s ease-in forwards; }
  @keyframes sealBreak { 30% { transform: scale(1.35); } 100% { transform: scale(.2) rotate(40deg); opacity: 0; } }
  #end-env.open .env-flap { animation: envFlap .8s ease .25s both; }
  #end-env.open .env-letter { transition-delay: .9s; }
  #end-env .env-hint { transition: opacity .3s; }
  #end-env.open .env-hint { opacity: 0; }
  #end-env.out .env { transition: transform .6s ease-in, opacity .6s ease-in; }
  #end-env.out .env-back, #end-env.out .env-front, #end-env.out .env-flap { transition: transform .55s ease-in, opacity .5s; transform: translateY(70%); opacity: 0; }
  #end-env.out .env-letter { transition: transform .6s cubic-bezier(.3,0,.3,1), opacity .5s .1s; transform: translateY(-58%) scale(1.5); opacity: 0; }
  #ending.reveal .end-card { animation: unfold .8s cubic-bezier(.2,.9,.2,1) both; transform-origin: 50% 0; }
  @keyframes unfold { 0% { opacity: 0; transform: perspective(800px) rotateX(-75deg) scaleY(.4); } 60% { opacity: 1; } 100% { transform: none; } }
  #ending.lettered .end-card h2 { animation: writeIn .6s ease .1s both; }
  #ending.lettered .end-card p { animation: writeIn 1.1s ease .5s both; }
  #ending.lettered .end-card .sign { animation: writeIn .6s ease 1.5s both; }
  @keyframes writeIn { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
  @keyframes lineIn { from { opacity: 0; transform: translateY(8px); } }
  #ending.lettered #end-cake { animation: lineIn .6s ease 2s both; }
  #ending.lettered #end-stats, #ending.lettered #end-btns { animation: lineIn .5s ease 2.4s both; }
  @media (prefers-reduced-motion: reduce) {
    #end-env:not(.open) .env, #end-env.open .env-seal, #ending.lettered .end-card h2, #ending.lettered .end-card p, #ending.lettered .end-card .sign, #ending.lettered #end-cake, #ending.lettered #end-stats, #ending.lettered #end-btns, .ab.sealed, .ab.sealed .ab-shine, .ab-slot.on, .pest-guy .bubble .more { animation: none; }
  }

  /* the paper pocket on the Album's last page, with the envelope tucked in */
  .pocket { position: relative; width: min(78%, 250px); aspect-ratio: 3 / 2.3; margin: 14px auto 6px; }
  .pk-env { position: absolute; left: 7%; right: 7%; top: 0; aspect-ratio: 3 / 2; cursor: pointer; animation: pkPeek 2.4s ease-in-out infinite; outline: none; }
  .pk-env:focus-visible { outline: 3px solid var(--red); outline-offset: 4px; border-radius: 6px; }
  @keyframes pkPeek { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .pk-back { position: absolute; inset: 0; background: #d9b04f; border: 3px solid var(--paper-ink); border-radius: 5px; }
  .pk-paper { position: absolute; left: 9%; right: 9%; top: 8%; height: 70%; background: var(--paper); border: 2px solid var(--paper-ink); border-radius: 3px; }
  .pk-front, .pk-flap { position: absolute; left: 0; width: 100%; }
  .pk-front { top: 0; height: 100%; }
  .pk-front polygon { fill: #f2d27a; stroke: var(--paper-ink); stroke-width: 3; vector-effect: non-scaling-stroke; }
  .pk-flap { top: 0; height: 62%; }
  .pk-flap polygon { fill: #e6bf5c; stroke: var(--paper-ink); stroke-width: 3; vector-effect: non-scaling-stroke; }
  .pk-seal { position: absolute; left: 50%; top: 56%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--red); border: 3px solid var(--paper-ink); color: var(--paper); font-size: 12px; display: grid; place-items: center; animation: envseal 1.2s ease-in-out infinite; }
  .pk-front-pocket { position: absolute; left: 0; right: 0; bottom: 0; height: 52%; background: linear-gradient(180deg, #caa877, #b8935f); border: 3px solid var(--paper-ink); border-radius: 4px 4px 8px 8px; box-shadow: 0 -2px 0 rgba(255,255,255,.35) inset, 0 4px 0 rgba(42,26,46,.25); }

  .tk-goal small { font-family: var(--f-body); font-size: 18px; line-height: .95; color: #4a3a5a; white-space: nowrap; }
  .tk-how { display: flex; gap: 16px; align-items: center; }
  .how { display: flex; align-items: center; gap: 8px; }
  .how i { position: relative; width: 44px; height: 44px; border-radius: 10px; background: var(--night); display: flex; justify-content: center; overflow: hidden; }
  .how i canvas { width: 28px; height: 30px; margin-top: 10px; image-rendering: pixelated; position: relative; z-index: 1; }
  .how-swipe i canvas { margin-left: 8px; }
  /* swipe: a dashed track with an arrow, next to the hand going down */
  .how-swipe i::before { content: ""; position: absolute; left: 9px; top: 6px; width: 3px; height: 26px; background: repeating-linear-gradient(to bottom, var(--lemon) 0 4px, transparent 4px 7px); }
  .how-swipe i::after { content: ""; position: absolute; left: 5px; top: 31px; border: 5.5px solid transparent; border-top: 7px solid var(--lemon); }
  .how-tap i canvas { animation: htap 1.1s steps(1) infinite; }
  .how-tap i::after { content: ""; position: absolute; left: 50%; top: 6px; width: 8px; height: 8px; margin-left: -5px; z-index: 2; border-radius: 50%; border: 2px solid var(--lemon); opacity: 0; animation: hring 1.1s ease-out infinite; }
  @keyframes htap { 0%, 55% { transform: translateY(0); } 60%, 80% { transform: translateY(3px); } }
  @keyframes hring { 0%, 58% { opacity: 0; transform: scale(.4); } 62% { opacity: 1; } 100% { opacity: 0; transform: scale(2.4); } }
  .how-swipe i canvas { animation: hswipe 1.2s cubic-bezier(.5,0,.6,1) infinite; }
  @keyframes hswipe { 0% { transform: translateY(-10px); opacity: 0; } 15% { opacity: 1; } 75% { transform: translateY(8px); opacity: 1; } 100% { transform: translateY(12px); opacity: 0; } }
  .how small, .tk-how.keys small { font-family: var(--f-body); font-size: 21px; line-height: 1; color: #4a3a5a; }
  .tk-how kbd { font-family: var(--f-num); font-size: 13px; font-weight: 700; border: 2px solid var(--paper-ink); border-radius: 5px; padding: 0 5px; background: #fff; }
  .tk-go { margin-top: auto; padding: 12px 16px !important; font-size: 22px !important; letter-spacing: .04em; }
  @media (orientation: landscape) and (max-height: 500px) {
    .tk-card { width: min(100%, 700px); }
    .tk-main { padding: 10px 16px 12px 18px; gap: 6px; }
    .tk-main h2 { font-size: 30px; } .tk-sub { font-size: 21px; }
    .tk-photo { padding: 12px 14px; }
  }
  @media (orientation: portrait) { .tk-card { grid-template-columns: 1fr; } .tk-photo { border-right: 0; border-bottom: 3px dashed #c9b89c; } .tk-photo::before, .tk-photo::after { display: none; } }
  @media (prefers-reduced-motion: reduce) { .tk-card, .tk-stamp, .how i canvas, .how-tap i::after { animation: none; } }
</style>
</head>

<script>
/* motore/testi.js */
/* Run to You — i testi su misura: legge l'ordine (window.ORDINE) e riempie i segnaposto delle battute del motore.
   Caricato subito dopo l'ordine, prima di tutto il resto.

   Chi corre è sempre chi riceve il regalo: se il regalo è per il coprotagonista, i due si scambiano qui
   (come in Memory Lane), così tutto il motore parla sempre di «a» (chi corre) e «b» (chi aspetta).

   Segnaposto (TXT.t):
     {A} {B}            nome di chi corre / dell'altro
     {a} {b}            soprannome (o il nome, se non c'è)
     {dest}             a chi è dedicata la festa e la lettera: «{a}» oppure «{a} e {b}» (regalo per tutti e due)
     {luogo1}…{luogo4}  i titoli delle tappe
     {boss}             il nome dell'antagonista, con il suo articolo se ce l'ha («La Scuola»)
     {scagnozzi}        il nome degli scagnozzi con l'articolo («i Compitini», «le Sveglie»)
     {cibo} {cibi}      il cibo preferito, singolare e plurale; {i cibi} con l'articolo
     {di boss} {a scagnozzi} {da …} {su …} {con …}   preposizione + articolo giusti («della Scuola», «alle Sveglie»)
     Con l'iniziale maiuscola ({Boss}, {Scagnozzi}, {Cibo}, {Cibi}) la prima lettera diventa maiuscola.
     [sottotitolo] [ingresso] [sconfitta] [grido1] [grido2] [grido3] [festa]   i pezzi su misura scritti da Claude */
'use strict';
const TXT = (() => {
  const O = window.ORDINE;
  // who runs is who receives the gift
  if (O.regalo && O.regalo.per === 'b') {
    const p = O.protagonisti; O.protagonisti = { a: p.b, b: p.a };
    if (O.regalo.da === 'a') O.regalo.da = 'b'; else if (O.regalo.da === 'b') O.regalo.da = 'a';
    O.regalo.per = 'a'; O.regalo.scambiati = true;
  }
  const P = O.protagonisti, sop = p => (p.soprannome || '').trim() || p.nome;
  const entrambi = !!(O.regalo && O.regalo.per === 'entrambi');
  const ant = O.antagonista || {}, sc = O.scagnozzi || {}, ci = O.cibo || {};
  // the article of a name: «i Compitini» → { art: 'i', rest: 'Compitini' }; «Il Dott. Valore Aggiunto» → { art: 'il', … }
  function split(s) {
    const m = String(s || '').match(/^(il|lo|la|i|gli|le|l')\s*(.*)$/i);
    return m ? { art: m[1].toLowerCase(), rest: m[2] } : { art: '', rest: String(s || '') };
  }
  const PREP = {
    a: { il: 'al', lo: 'allo', la: 'alla', i: 'ai', gli: 'agli', le: 'alle', "l'": "all'" },
    di: { il: 'del', lo: 'dello', la: 'della', i: 'dei', gli: 'degli', le: 'delle', "l'": "dell'" },
    da: { il: 'dal', lo: 'dallo', la: 'dalla', i: 'dai', gli: 'dagli', le: 'dalle', "l'": "dall'" },
    su: { il: 'sul', lo: 'sullo', la: 'sulla', i: 'sui', gli: 'sugli', le: 'sulle', "l'": "sull'" },
    con: { il: 'con il', lo: 'con lo', la: 'con la', i: 'con i', gli: 'con gli', le: 'con le', "l'": "con l'" }
  };
  const glue = (a, rest) => a.endsWith("'") ? a + rest : a + ' ' + rest;
  function withPrep(prep, name) {
    const { art, rest } = split(name);
    if (!art) return prep + ' ' + rest;
    return glue(PREP[prep][art], rest);
  }
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const luoghi = (O.tappe || []).map(t => (t.luogo && t.luogo.titolo) || '');
  const V = {
    A: P.a.nome, B: P.b.nome, a: sop(P.a), b: sop(P.b),
    dest: entrambi ? sop(P.a) + ' e ' + sop(P.b) : sop(P.a),
    boss: ant.nome || '', scagnozzi: sc.nome || '',
    cibo: ci.singolare || '', cibi: ci.plurale || '', 'i cibi': glue(ci.articolo || 'i', ci.plurale || ''),
    luogo1: luoghi[0], luogo2: luoghi[1], luogo3: luoghi[2], luogo4: luoghi[3]
  };
  const PEZZI = {
    sottotitolo: ant.presentazione || '', ingresso: ant.ingresso || '', sconfitta: ant.sconfitta || '',
    grido1: (sc.grida || [])[0] || '', grido2: (sc.grida || [])[1] || '', grido3: (sc.grida || [])[2] || '',
    festa: O.festa || ''
  };
  function t(s) {
    if (typeof s !== 'string') return s;
    return s
      .replace(/\{(a|di|da|su|con) (boss|scagnozzi|cibi)\}/g, (m, p, k) => withPrep(p, k === 'cibi' ? V['i cibi'] : V[k]))
      .replace(/\{([A-Za-z]+[0-9]?|i cibi)\}/g, (m, k) => {
        if (k in V) return V[k];
        const low = k.charAt(0).toLowerCase() + k.slice(1);
        if (low in V && k !== low) return cap(V[low]);
        return m;
      })
      .replace(/\[([a-z]+[0-9]?)\]/g, (m, k) => k in PEZZI ? PEZZI[k] : m);
  }
  return { t, V, PEZZI, entrambi, withPrep, cap };
})();

  /* ---------------- side and back views (added 21 nov 2026, see REGOLE-PERSONAGGI.md) ----------------

  function looks(ch) {

  }

  /* the head from the side, rows 0-8, looking right, with the proportions of El Falcon from the side:

  const SIDE_SHORT = ['....hhhhhh....', '...hhHHhhhh...', '..hhhhhhhhhh..', '..ohhhhhhhhhh.', '..ohhhhhsssss.', '..ohhrhssssss.', '..ohhrsssssss.', '...ohhsssssss.', '....ohsssss...'];

    curly: ['....ohhhho....', '..ohhhHhhho...', '.ohhhhhhhhho..', 'ohhhhhhhhhhho.', 'ohhhhhhhsssso.', 'hhhhhhhhsssss.', 'ohhhhhhhsssss.', 'hhhhhhhhsssss.', 'ohhhhhhhsss...'],
    afro: ['...ohhhhhho...', '.ohhhHHhhhhho.', 'ohhHhhhhhhhhho', 'hhhhhhhhhhhhh.', 'hhhhhhhhsssss.', 'hhhhhhhhsssss.', 'hhhhhhhhsssss.', 'ohhhhhhhsssss.', '.ohhhhsssss...'],

    bald: ['....ssssss....', '...sLssssss...', '..ssssssssss..', '..sssssssssss.', '..sssssssssss.', '..shhrsssssss.', '..sshrsssssss.', '...ssssssssss.', '....sssssss...']

    3: { stand: ['.....LLLLL....', '.....LLLLL....', '.....nnnnnn...'], a: ['....LLL.LLL...', '...LLL...LLL..', '...nn.....nnn.'], b: ['.....LLLLL....', '.....LLLLL....', '.....nnnnn....'], air: ['....LLL.LLL...', '....nnn.nnn...', '..............'],
      // the poses of the running games (24 nov 2026): El Falcon's in Run to You, one pixel to the right as the body here
      up: ['....LLLLLLL...', '...LL....Lnn..', '..nn..........'], down: ['.....LLLLL....', '......LLLLL...', '.......nnnnn..'],
      land: ['....LLLLLLLL..', '...nnn...nnn..'], hurt: ['....LLL.LLL...', '..LLL.....LL..', '.nn........nn.'] },

      up: ['....LLLLLLnn..', '..nn..........'], down: ['.....LLLLL....', '......nnnnnn..'], land: ['...nnLLLLLnn..'], hurt: ['..LLL.....LL..', '.nn........nn.'] }

  function buildSide(ch, mood, frame) {

    if (st === 'bun') { [[2, 0], [3, 0], [1, 1], [2, 1]].forEach(([x, y]) => { put(x, y, hair); hairAt.push([x, y]); }); put(2, 0, pal.H); }

    for (let i = 0; i < nT; i++) { const row = Array(SW).fill(null); const [a, b] = span(i); for (let x = a; x <= b; x++) row[x] = cloth; rows.push(row); }
    const skirtRows = kind === 'skirt' ? B.pants + (L.nL === 3 || B.pants === 1 ? 1 : 0) : 0;
    for (let i = 0; i < B.pants; i++) {
      const row = Array(SW).fill(null);
      if (kind === 'skirt') { const w = [[3, 12], [4, 11], [4, 10]][skirtRows - 1 - i]; for (let x = w[0]; x <= w[1]; x++) row[x] = i === skirtRows - 1 ? L.legsD : L.legsC; }
      else for (let x = L.dress ? 3 : 4; x <= (L.dress ? 11 : 10); x++) row[x] = L.dress ? cloth : L.legsC;

    }

    // long hair falls behind the shoulders

    // the tops

    if (top === 'plaid') for (let y = T; y < T + nT; y++) for (let x = 0; x < SW; x++) if (inTorso(x, y)) { const v = x % 3 === 1, h = (y - T) % 3 === 2; if (v && h) put(x, y, dark(cloth, 0.55)); else if (v || h) put(x, y, clothD); }
    if (top === 'stripes') { const mid = wide ? T + 2 : T + 1; [mid, mid + 2].forEach(y => { if (y < T + nT) for (let x = 0; x < SW; x++) if (inTorso(x, y)) put(x, y, L.clothL); }); }
    if (top === 'overalls') { for (let y = T + 2; y < T + nT; y++) for (let x = 0; x < SW; x++) if (rows[y][x]) put(x, y, L.legsC); pts(L.legsC, [[9, T], [9, T + 1]]); put(10, T + 2, C.gold); }
    if (top === 'sweater') { pts(clothD, [[7, T], [8, T], [9, T], [10, T]]); for (let x = 0; x < SW; x++) if (rows[T + nT - 1][x]) put(x, T + nT - 1, clothD); }
    if (top === 'hoodie') pts(clothD, [[3, T], [3, T + 1], [4, T], [5, T]]);
    if (top === 'collar') pts(L.light ? '#c9d6ff' : C.white, [[9, T], [10, T]]);
    if (top === 'jacket') for (let y = T; y <= T + 2; y++) put(10, y, C.white);
    if (kind === 'skirt') for (let y = T + nT - skirtUp(nT); y < T + nT; y++) { const [a, b] = span(y - T); for (let x = a; x <= b; x++) put(x, y, L.legsC); }
    // the arm on the side of the body, two pixels wide (the back one darker): the sleeve, the bare arm, the hand.
    // It stays still while walking (only the legs move, as El Falcon and Il Crocco in Operazione Viaggettino)
    const handR = Math.max(...B.arms.filter(a => a[3] === 'skin').map(a => a[2])), longS = SLEEVES.includes(top) || top === 'hoodie' || top === 'jacket';
    const sleeveBack = dark(cloth, 0.45);

    else if (fh === 'mustache') pts(hair, [[11, E + 1], [12, E + 1]]);
    else if (fh === 'goatee') pts(hair, [[9, E + 3], [10, E + 3]]);

    else if (mouth === 'smile') pts(line, [[11, E + 2], [12, E + 2]]);
    else if (mouth === 'teeth') { put(11, E + 2, line); put(12, E + 2, C.white); }
    else if (mouth === 'tongue') { put(12, E + 2, line); put(13, E + 2, C.pink); }

   * A costume is a «look»: the fields of the character it changes ({ top: 'dress', outfit: '#1E2A5E', accessories:
   * { neck: 'necklace' }, extra: { gown: true } }): any colour, the accessories one zone at a time, the game pieces in
   * «extra». wear(ch, look1, look2…) puts them on in order and gives back the character dressed (its own hair, face and
   * body stay); pass that to sprite(). The fixed costumes and the jewels are the same in every game; a game adds its
   * own (e.g. one per world in Run to You) in the same format. Added 24 nov 2026. */
  const COSTUMES = {
    tintarella: { name: 'Tintarella', look: { top: 'collar', outfit: '#FF7A59', legs: 'shorts', pants: '#2F5FB8', shoes: '#F2C94C', accessories: { face: 'none' }, extra: { flowers: true, open: true, sunscreen: true } } },
    settimana: { name: 'Settimana bianca', look: { top: 'jacket', outfit: '#E23B3B', legs: 'pants', pants: '#26222E', shoes: '#26222E', accessories: { head: 'none', face: 'none', neck: 'none' }, extra: { coat: 'puffer', hat: 'skihat', hatColor: '#2F5FB8', goggles: true } } }
  };
  // «In blu», «In giallo»…: the character's own clothes with the top in another colour. recolors(ch, n) picks the n
  // colours of the site's palette farthest from the one it has (and from each other), so the change always shows.
  const COLOR_NAMES = { '#FF3D7F': 'rosa', '#4D7CFE': 'blu', '#FFD23F': 'giallo', '#9B6BFF': 'viola', '#FF7A59': 'arancione', '#1F5C3A': 'verde', '#22D3A6': 'turchese' }; // the bright ones (short names: they fit the shop cards)
  // the name of the top in the shop, and its gender (the colour agrees: «Maglietta gialla», «Maglione giallo»)
  const TOP_NOUN = { heart: ['Maglietta', 'f'], plain: ['Maglietta', 'f'], stripes: ['Righe', 'fp'], collar: ['Polo', 'f'], plaid: ['Camicia', 'f'], sweater: ['Maglione', 'm'], hoodie: ['Felpa', 'f'], jacket: ['Giacca', 'f'], tank: ['Canottiera', 'f'], overalls: ['Salopette', 'f'], dress: ['Vestito', 'm'] };
  const AGREE = { giallo: { f: 'gialla', fp: 'gialle' }, arancione: { fp: 'arancioni' }, verde: { fp: 'verdi' } };
  const colourName = (c, g) => { const base = COLOR_NAMES[c]; return (AGREE[base] || {})[g] || base; };
  function recolors(ch, n) {
    const up = upgrade(ch), own = hex(up.outfit || '#d64545'), d = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]), picked = [];
    const [noun, g] = TOP_NOUN[up.top] || ['Maglietta', 'f'];
    for (let i = 0; i < (n || 2); i++) {
      const best = Object.keys(COLOR_NAMES).filter(c => !picked.includes(c)).map(c => [c, Math.min(d(hex(c), own), ...picked.map(p => d(hex(c), hex(p))))]).sort((p, q) => q[1] - p[1])[0];
      if (best) picked.push(best[0]);
    }
    return picked.map((c, i) => ({ id: 'col' + (i + 1), name: noun + ' ' + colourName(c, g), look: { outfit: c } }));
  }
  const JEWELS = {
    o: { name: 'Orecchini', look: { accessories: { ears: 'earrings' } } },
    b: { name: 'Bracciale', look: { extra: { wrist: 'bracelet' } } },
    c: { name: 'Collana', look: { accessories: { neck: 'necklace' } } }
  };
  function wear(ch, ...wearing) {
    const out = upgrade(ch);
    wearing.forEach(w => {
      const l = w && w.look ? w.look : w; if (!l) return;
      Object.keys(l).forEach(k => {

        else out[k] = l[k];
      });
    });
    return out;
  }

  return { VERSION, OPTIONS, DEFAULTS, FIELDS, ZONES, GRID: { w: SW, h: SH }, normalize, validate, sprite, COSTUMES, JEWELS, wear, recolors };
});

function rowsToCanvas(rows, map, scale = 1) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const cv = document.createElement('canvas'); cv.width = w * scale; cv.height = h * scale;
  const cx = cv.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) {
    const ch = rows[y][x]; if (ch === '.') continue;
    cx.fillStyle = (map && map[ch]) || PAL[ch] || '#ff00ff';
    cx.fillRect(x * scale, y * scale, scale, scale);
  }
  return cv;
}

<script>

<script>
/* motore/vg.js */
/* Motore comune dei minigiochi di El Falcon e Il Crocco.
   Usa gli sprite, la musica e le cartoline copiati da Operazione Viaggettino (sprites.js, audio.js, postcards.js)
   e ne rifà l'interfaccia: dialoghi con ritratto, pannelli, cartoline, busta finale. */
'use strict';
// El Falcon's look (costume and jewels) is shared by the three games: bought in Run to You, worn everywhere
window.VG_JEWELS = '';

const VG = (() => {
  const byId = id => document.getElementById(id);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };

  // ---------- storage (fails silently in private mode) ----------
  // each game has its own save (the build sets SALVATAGGIO: the order's code, plus the version in the test games), so
  // another game, the original or an older test version on the same phone never decide what this one has already shown
  const SAVE = window.SALVATAGGIO || 'rty_';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(SAVE + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(SAVE + k, JSON.stringify(v)); } catch (e) { } }
  };

  // ---------- El Falcon's wardrobe ----------
  // Costumes are recolours of the jacket plus a few pixels on top (hat, beanie, scarf, sunglasses): sprites.js stays untouched.
  const put = (rows, y, x, str) => { if (!rows[y]) return; rows[y] = rows[y].slice(0, x) + str + rows[y].slice(x + str.length); };
  const COSTUMES = {
    classica: { name: 'Giacca rossa', price: 0 },
    verde: { name: 'Giacca verde', price: 60, map: { r: '#3f9a4a', R: '#2e7a38' } },
    viola: { name: 'Giacca viola', price: 60, map: { r: '#7a4fb0', R: '#5a3a8a' } },
    paglia: { name: 'Cappello di paglia', price: 120, map: { C: '#e9c46a', c: '#c0392b' },
      edit(r, v) { if (v === 'side') { put(r, 0, 3, 'CCCCCCC'); put(r, 1, 3, 'ccccccc'); put(r, 2, 1, 'CCCCCCCCCCCC'); } else { put(r, 0, 3, 'CCCCCCCC'); put(r, 1, 3, 'cccccccc'); put(r, 2, 0, 'CCCCCCCCCCCCCC'); } } },
    inverno: { name: 'Berretto e sciarpa', price: 140, map: { x: '#d64545', X: '#fff6e0', W: '#fff6e0' },
      edit(r, v) { put(r, 0, 4, 'xxxxxx'); put(r, 1, 2, 'xxxxxxxxxx'); put(r, 2, 1, 'XXXXXXXXXXXX'); if (v === 'down') { put(r, 9, 3, 'WxWxWxWx'); put(r, 10, 6, 'xW'); } else if (v === 'side') put(r, 9, 4, 'WxWxWx'); } },
    tresor: { name: 'Look da Tresor', price: 150, map: { r: '#2a2a38', R: '#16141c' },
      edit(r, v) { if (v === 'down') put(r, 5, 3, 'kkkkkkkk'); else if (v === 'side') put(r, 5, 8, 'kkkkk'); } }
  };
  const JEWELS = { o: { name: 'Orecchini', price: 40 }, b: { name: 'Bracciale', price: 40 }, c: { name: 'Collana di Skiathos', price: 0, gift: true } };
  const look = Object.assign({ costume: 'classica', jewels: '', owned: { classica: true }, ownedJ: {} }, (() => { try { return JSON.parse(localStorage.getItem(SAVE + 'look')) || {}; } catch (e) { return {}; } })());
  window.VG_JEWELS = look.jewels;
  function saveLook() { window.VG_JEWELS = look.jewels; try { localStorage.setItem(SAVE + 'look', JSON.stringify(look)); } catch (e) { } }
  function falconFrames() {
    const cos = COSTUMES[look.costume] || COSTUMES.classica, jk = look.jewels || '';
    const key = 'vgfal_' + look.costume + '_' + jk; if (SPRITE_CACHE[key]) return SPRITE_CACHE[key];
    const head = (rows, v) => { const r = wearJewels(rows.slice(), v, jk); if (cos.edit) cos.edit(r, v); return r; };
    const H = { down: head(FALCON_HEAD_DOWN, 'down'), up: head(FALCON_HEAD_UP, 'up'), side: head(FALCON_HEAD_SIDE, 'side') };
    const map = cos.map || null, out = {};
    for (const f of ['stand', 'a', 'b']) {
      out['down_' + f] = outlineCanvas(rowsToCanvas([...H.down, ...LEGS_FRONT[f]], map));
      out['up_' + f] = outlineCanvas(rowsToCanvas([...H.up, ...LEGS_FRONT[f]], map));
      const r = outlineCanvas(rowsToCanvas([...H.side, ...LEGS_SIDE[f]], map));
      out['right_' + f] = r; out['left_' + f] = flipCanvas(r);
    }
    return (SPRITE_CACHE[key] = out);
  }

  // ---------- the two protagonists ----------
  // Drawn from the order: the customer's choices from the Playtale site («v»: drawn by PTAvatar, avatar.js, as in Memory
  // Lane), or the two of the original drawn by hand («disegno»: only for Sara's game; El Falcon runs, Il Crocco waits).
  // A is always the one who runs (testi.js has already swapped them when the gift is for B).
  const heroCh = k => { const p = ((window.ORDINE.protagonisti || {})[k] || {}).personaggio || {}; return p.v && window.PTAvatar ? PTAvatar.normalize(p) : null; };
  const HERO = { a: heroCh('a'), b: heroCh('b') }, heroCache = {};
  // what A is wearing (the Negozio): the costume and the jewels put on with PTAvatar.wear (the fixed ones from the site,
  // the ones of the worlds from catalogo/costumi.js); B always wears his own clothes
  // «Unisciti a loro» for a boss without its costume yet: a dark suit and a tie, as one of the henchmen in disguise
  const BOSS_FALLBACK = { look: { top: 'jacket', outfit: '#3A3F55', legs: 'pants', pants: '#26222E', shoes: '#26222E', accessories: { neck: 'tie' } } };
  const dressed = k => {
    if (k !== 'a') return HERO[k];
    const id = look.costume, recol = PTAvatar.recolors(HERO.a, 2).find(r => r.id === id);
    const cos = id === 'og' ? (window.COSTUMI_BOSS || {})[(window.ORDINE.antagonista || {}).aspetto] || BOSS_FALLBACK
      : recol || PTAvatar.COSTUMES[id] || (window.COSTUMI_MONDI || {})[id];
    return PTAvatar.wear(HERO.a, cos); // (no jewels on the customer's characters: they would not show)
  };
  function avFrames(k) {
    const key = k === 'a' ? 'a_' + look.costume + '_' + (look.jewels || '') : k;
    if (heroCache[key]) return heroCache[key];
    const ch = dressed(k), out = {};
    for (const f of ['stand', 'a', 'b']) {
      const side = PTAvatar.sprite(ch, { view: 'side', frame: f });
      out['down_' + f] = PTAvatar.sprite(ch, { frame: f }); out['up_' + f] = PTAvatar.sprite(ch, { view: 'back', frame: f });
      out['right_' + f] = side; out['left_' + f] = flipCanvas(side);
    }
    return (heroCache[key] = out);
  }
  // the poses of the run, from the side looking right: up, down, land, hurt, slide, sit (avatar.js); null when drawn by hand
  const hero = { avatar: k => !!HERO[k], pose: (k, name) => HERO[k] ? PTAvatar.sprite(dressed(k), { view: 'side', frame: name }) : null,
    front: (k, opts) => HERO[k] ? PTAvatar.sprite(HERO[k], opts || {}) : null, ch: k => HERO[k] };
  // the first row with something drawn (the customer's characters can be shorter: empty rows on top)
  const TOPS = new WeakMap();
  function topOf(img) {
    if (TOPS.has(img)) return TOPS.get(img);
    const d = img.getContext ? img.getContext('2d').getImageData(0, 0, img.width, img.height).data : null; let y = 0;
    if (d) { outer: for (; y < img.height; y++) for (let x = 0; x < img.width; x++) if (d[(y * img.width + x) * 4 + 3]) break outer; if (y >= img.height) y = 0; }
    TOPS.set(img, y); return y;
  }

  // ---------- sprites ----------
  const falcon = (dir = 'right', f = 'stand') => (HERO.a ? avFrames('a') : falconFrames())[dir + '_' + f];
  const crocco = (dir = 'left', f = 'stand') => (HERO.b ? avFrames('b') : charFrames('crocco'))[dir + '_' + f];
  const npc = (look, f = 'down_stand') => humanoidSprite(look, LOOKS[look])[f];
  const item = (name, scale = 1, outline = true) => customSprite(name, scale, outline);
  const fromRows = (key, rows, map, outline = true) => {
    const k = 'vg_' + key; if (SPRITE_CACHE[k]) return SPRITE_CACHE[k];
    let c = rowsToCanvas(rows, map); if (outline) c = outlineCanvas(c);
    return (SPRITE_CACHE[k] = c);
  };
  const recolor = (key, name, map, outline = true) => {
    const k = 'vgr_' + key; if (SPRITE_CACHE[k]) return SPRITE_CACHE[k];
    const d = CUSTOM[name]; let c = rowsToCanvas(d.rows, Object.assign({}, d.map || {}, map)); if (outline) c = outlineCanvas(c);
    return (SPRITE_CACHE[k] = c);
  };
  const whiteCache = new Map();
  function white(img) {
    let w = whiteCache.get(img); if (w) return w;
    w = document.createElement('canvas'); w.width = img.width; w.height = img.height;
    const c = w.getContext('2d'); c.drawImage(img, 0, 0); c.globalCompositeOperation = 'source-in'; c.fillStyle = '#ffffff'; c.fillRect(0, 0, w.width, w.height);
    whiteCache.set(img, w); return w;
  }
  // Draw a sprite anchored at its feet (x = centre, y = bottom)
  function draw(c, img, x, y, o) {
    o = o || {};
    const dx = Math.round(x - img.width / 2), dy = Math.round(y - img.height);
    if (o.alpha !== undefined) c.globalAlpha = o.alpha;
    if (o.flip) { c.save(); c.translate(dx + img.width, dy); c.scale(-1, 1); c.drawImage(o.flash ? white(img) : img, 0, 0); c.restore(); }
    else c.drawImage(o.flash ? white(img) : img, dx, dy);
    c.globalAlpha = 1;
  }

  // ---------- speakers ----------
  // Only the voices that actually speak in the three games (add more here when a new line needs them)
  // who speaks: the two protagonists (A runs, B waits), the boss and his henchmen (from the order), the narrator
  const SPEAKERS = {
    falcon: { name: window.ORDINE.protagonisti.a.nome, col: '#ffd84a', img: () => falcon('down') },
    crocco: { name: window.ORDINE.protagonisti.b.nome, col: '#7cc6e8', img: () => crocco('down') },
    boss: { name: (window.ORDINE.antagonista || {}).nome || '', col: '#ff6b57', look: (window.ORDINE.antagonista || {}).aspetto },
    scag: { name: (window.ORDINE.scagnozzi || {}).singolare || '', col: '#c9bfe0', look: (window.ORDINE.scagnozzi || {}).divisa },
    narr: { name: '', col: '#c9bfe0' }
  };
  function speakerImg(sp) { if (sp.img) return sp.img(); if (sp.look) return npc(sp.look); return null; }
  function portrait(cv, img) {
    const n = 22; cv.width = n; cv.height = n; const c = cv.getContext('2d'); c.imageSmoothingEnabled = false; c.clearRect(0, 0, n, n);
    if (!img) return;

  }

  // ---------- dialog ----------
  const Dialog = (() => {
    let box, nameEl, textEl, moreEl, pcv, srEl, queue = [], resolveFn = null, typing = null, full = '', open = false;
    function build() {
      if (box) return;
      box = el('div'); box.id = 'dialog'; box.hidden = true;
      box.innerHTML = '<canvas id="dlg-portrait" class="px" aria-hidden="true"></canvas><div class="dlg-body" aria-hidden="true"><div id="dlg-name"></div><div id="dlg-text"></div></div><div id="dlg-more" aria-hidden="true">▼</div>';
      (byId('app') || document.body).appendChild(box);
      // screen readers get the whole line at once, not one letter every 22 ms

      nameEl = byId('dlg-name'); textEl = byId('dlg-text'); moreEl = byId('dlg-more'); pcv = byId('dlg-portrait');
      box.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); advance(); });
      window.addEventListener('keydown', e => { if (!open) return; if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); advance(); } }, true);
    }
    function show() {
      const [who, txt] = queue.shift();
      const sp = SPEAKERS[who] || { name: who, col: '#fff6e0' };
      box.dataset.who = who; nameEl.textContent = sp.name; nameEl.style.color = sp.col || '#fff6e0';
      portrait(pcv, speakerImg(sp));
      full = txt; textEl.textContent = ''; moreEl.hidden = true;
      srEl.textContent = (sp.name ? sp.name + ': ' : '') + txt;
      let i = 0; clearInterval(typing);
      if (REDUCED) { textEl.textContent = full; moreEl.hidden = false; return; }
      // the letters follow the clock (22 ms each), not the count of timer ticks: if a frame is slow the line catches up
      // instead of stopping; it starts a moment after the box appears, once the box is drawn
      const t0 = performance.now() + 60;
      typing = setInterval(() => {
        const n = Math.min(full.length, Math.max(0, Math.floor((performance.now() - t0) / 22)));
        if (n === i) return;
        const blip = Math.floor(n / 2) !== Math.floor(i / 2) && full[n - 1] !== ' ';
        i = n; textEl.textContent = full.slice(0, i);
        if (blip) Audio.sfx('text');
        if (i >= full.length) { clearInterval(typing); typing = null; moreEl.hidden = false; }
      }, 16);
    }
    function advance() {
      if (!open) return;
      if (typing) { clearInterval(typing); typing = null; textEl.textContent = full; moreEl.hidden = false; return; }
      if (queue.length) { show(); return; }
      open = false; box.hidden = true; const f = resolveFn; resolveFn = null; if (f) f();
    }
    return {
      get open() { return open; },
      say(lines) {
        build(); queue = lines.map(l => [l[0], TXT.t(l[1])]); if (!queue.length) return Promise.resolve(); // the order fills the placeholders
        open = true; box.hidden = false; show();
        return new Promise(r => { resolveFn = r; });
      },
      advance
    };
  })();

  // ---------- toast ----------
  let toastT = 0;
  function toast(txt, ms = 1600) {
    let t = byId('toast'); if (!t) { t = el('div'); t.id = 'toast'; t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); (byId('app') || document.body).appendChild(t); }

  }

  // ---------- audio helpers ----------
  function unlockOnce() {
    const f = () => { Audio.unlock(); };
    window.addEventListener('pointerdown', f, { passive: true }); window.addEventListener('keydown', f);

  // ---------------------------------------------------------------- the autopilot (tests and video recordings)
  // Looks two jumps ahead: a jump is only good if, once landed, there is still a way to go on safely.
  const Bot = (() => {

    // 0 = safe, 1 = hit, 2 = a stomp (safe, and worth it)
    function danger(p, t, gone) {
      const { hw, hh } = dims(p);
      if (hazardHit(p)) return { hit: true };
      const dt0 = t - G.t;
      for (const e of G.enemies) {
        if (e.dead || gone.has(e.id) || Math.abs(e.x - p.x) > 160) continue;
        if (e.ghost) continue;
        const at = e.boss ? bossAt(e, dt0) : enemyAt(e, dt0); if (!at) continue;
        const ex = at.x, ey = at.y;
        if (p.x + hw > ex - e.w / 2 && p.x - hw < ex + e.w / 2 && p.y > ey - e.h && p.y - hh < ey) {
          const stomp = p.vy > 40 && p.y - (ey - e.h) < (e.boss ? 16 : 10);
          if (stomp) return { stomp: e };
          if (e.boss) return { hit: true };
          if (!(canRam(e) || p.speedG > 0)) return { hit: true };
        }
      }
      if (G.th.quad && p.blocked) return { hit: true }; // crashing into a rock costs a heart
      for (const q of G.proj) { const qx = q.x + q.vx * dt0, qy = q.y + q.vy * dt0 + 0.5 * q.g * dt0 * dt0; if (Math.abs(qx - p.x) < hw + 4 && qy > p.y - hh - 4 && qy < p.y + 4) return { hit: true }; }
      for (const f of G.fallers) {
        if (f.done || Math.abs(f.x - p.x) > 40) continue;
        let fy;
        if (f.on) fy = f.y + f.vy * dt0 + 190 * dt0 * dt0;
        else if (p.x > f.x - G.th.speed * 1.75) { const tt = Math.max(0, dt0 - Math.max(0, (f.x - G.th.speed * 1.75 - P.x) / G.th.speed)); fy = -20 + 190 * tt * tt; }
        else continue;
        if (fy > p.y - hh - 4 && fy - 8 < p.y) return { hit: true };
      }
      return null;
    }
    // simulate one plan; stops once every action is done and the player is back on the ground
    function run(p0, t0, pl, maxT, picks, hold0 = -1) {
      const p = Object.assign({}, p0), h = 1 / 60, gone = new Set();
      let t = t0, el = 0, bonus = 0, i = 0;
      const lastAt = pl.length ? Math.max(...pl.map(a => a.at)) : 0;
      const speed = G.th.speed * (P.speedG > 0 ? 1.3 : 1);
      while (el < maxT) {
        p.vx = speed; el += h; i++;
        const now = a => a.at >= el - h - 1e-9 && a.at < el - 1e-9;
        const jump = pl.some(a => !a.slide && now(a)), down = pl.some(a => a.slide && now(a));
        const holdUntil = pl.reduce((m, a) => !a.slide && a.at < el ? a.at + a.hold : m, hold0);
        movePlayer(p, h, t, jump, el <= holdUntil, down);
        if (padHit(p)) { p.vy = G.th.quad ? Q_PAD_V : PAD_V; p.ground = false; p.jumps = 1; p.cut = true; }
        t += h;
        if (p.y > MAP_H + 10) return { dead: true, x: p.x };
        const d = danger(p, t, gone);
        if (d && d.hit) return { dead: true, x: p.x };
        if (d && d.stomp) { gone.add(d.stomp.id); bonus += d.stomp.boss ? 900 : 25; p.vy = STOMP_HOLD_V; p.jumps = 1; p.cut = false; p.ground = false; }
        if (i % 3 === 0) for (const e of picks) { if (!e.got && Math.abs(e.x - p.x) < 12 && e.y > p.y - 26 && e.y < p.y + 8) { e.got = true; bonus += e.t === 'ticket' ? 500 : e.t === 'power' ? 40 : e.t === 'special' ? 30 : 6; } }
        if (el > lastAt + 0.12 && el >= 0.14 && p.ground && !(p.slide > 0.05)) break;
      }
      return { dead: false, p, t, bonus, x: p.x, el };
    }
    const PLANS = [
      [], [{ at: 0, hold: 0.04 }], [{ at: 0, hold: 0.16 }], [{ at: 0, hold: 0.5 }],
      [{ at: 0, hold: 0.5 }, { at: 0.2, hold: 0.5 }], [{ at: 0, hold: 0.5 }, { at: 0.36, hold: 0.5 }], [{ at: 0, hold: 0.5 }, { at: 0.52, hold: 0.5 }],
      [{ at: 0, hold: 0.16 }, { at: 0.3, hold: 0.5 }], [{ at: 0.1, hold: 0.5 }], [{ at: 0.2, hold: 0.5 }],
      [{ at: 0, slide: true }], [{ at: 0.12, slide: true }], [{ at: 0.25, slide: true }]
    ];
    const NEXT = [[], [{ at: 0, hold: 0.5 }], [{ at: 0, hold: 0.16 }], [{ at: 0, hold: 0.5 }, { at: 0.3, hold: 0.5 }], [{ at: 0, hold: 0.5 }, { at: 0.5, hold: 0.5 }], [{ at: 0, slide: true }]];
    const AIR = [[], [{ at: 0, hold: 0.5 }], [{ at: 0.1, hold: 0.5 }], [{ at: 0.22, hold: 0.5 }]];
    function picksNear() { return G.ents.filter(e => !e.taken && e.x > P.x - 10 && e.x < P.x + 260).map(e => ({ x: e.x, y: e.y, t: e.t, got: false })); }
    function choose(opts) {
      let best = null, bs = -Infinity;
      for (const pl of opts) {
        const picks = picksNear();
        const r = run(P, G.t, pl, 1.6, picks);
        // a plan must also work if the timing is a few pixels off
        if (!r.dead) { for (const off of [-5, 6]) { const r3 = run(Object.assign({}, P, { x: P.x + off }), G.t, pl, 1.6, []); if (r3.dead) { r.dead = true; break; } } }

        if (r.dead) s = -100000 + r.x;

          s = ok < 0 ? -50000 + r.x : r.bonus + ok + (pl.length ? -3 * pl.length : 4);

      reset() { plan = null; nextThink = 0; }
    };

    // with the customer's character the Album goes in front of him, at the height of his hand, his hand on its edge
    const avB = VG.hero.avatar('b');
    const album = () => { const ax = kx + (avB ? 3 : 10), ay = Math.round(gy - (avB ? 22 : 25) + H.jk.y), sw = Math.round(Math.sin(H.t * 7) * 1.5);
      R(c, ax - 1, ay - 1, 14, 11, '#1a1024'); R(c, ax, ay, 12, 9, '#c0392b'); R(c, ax + 1, ay + 1, 10, 1, '#e9b52a'); R(c, ax + 1, ay + 7, 10, 1, '#e9b52a');
      R(c, ax + 5, ay, 2, 9, '#ffd84a'); R(c, ax, ay + 4, 12, 1, '#ffd84a'); R(c, ax + 4, ay - 2, 4, 2, '#ffd84a');
      // the tag: a little bigger than before, and the writing fills it
      const TW = 21, TH = 9, tx = ax - 2 + sw, ty = ay + 12; R(c, ax + 9, ay + 9, 1, 3, '#2a1a2e');
      R(c, tx - 1, ty - 1, TW + 2, TH + 2, '#2a1a2e'); R(c, tx, ty, TW, TH, '#fff6e0'); R(c, tx + 1, ty + 1, 1, 1, '#c9b89c');
      H.tagFont = H.tagFont || homeTagFont();
      st.text('Per te', tx + TW / 2 + 0.5, ty + TH / 2 + 0.3, { size: Math.max(9, H.tagFont * (TW - 2) * st.SCALE), col: '#2a1a2e', align: 'center', font: 'hand', weight: 700, shadow: false }); };
    if (!avB) album();
    draw(VG.crocco('right', fr(H.jk)), kx, H.jk);
    if (avB) { album(); const ax = kx + 3, ay = Math.round(gy - 22 + H.jk.y); R(c, ax - 3, ay + 1, 6, 6, '#1a1024'); R(c, ax - 2, ay + 2, 4, 4, VG.hero.ch('b').skin); }
    draw(VG.falcon('right', fr(H.jf)), fx, H.jf);
    // the little hearts when she lands
    for (const h of H.hearts) { h.t -= dt; h.y -= dt * 18; const X = Math.round(h.x), Y = Math.round(h.y), tw = Math.floor(h.t * 8) % 2; c.globalAlpha = clamp(h.t, 0, 1); R(c, X + 2, Y, 1, 5, '#ffd84a'); R(c, X, Y + 2, 5, 1, '#ffd84a'); R(c, X + 2, Y + 2, 1, 1, '#fff6e0'); if (tw) { R(c, X + 1, Y + 1, 1, 1, '#ffd84a'); R(c, X + 3, Y + 3, 1, 1, '#ffd84a'); R(c, X + 3, Y + 1, 1, 1, '#ffd84a'); R(c, X + 1, Y + 3, 1, 1, '#ffd84a'); } }
    c.globalAlpha = 1; H.hearts = H.hearts.filter(h => h.t > 0);
  }

  // ---------------------------------------------------------------- loop
  let conf = [], fireworks = 0, fw = [];
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.04, (now - last) / 1000); last = now;
    const c = ctx();
    if (G.mode === 'title') { drawHome(c, dt); st.flushText(); requestAnimationFrame(frame); return; }
    if (G.mode === 'intro' && G.intro) { drawIntro(c, dt); st.flushText(); requestAnimationFrame(frame); return; }
    if (introAlbumEl && !introAlbumEl.hidden) introAlbumEl.hidden = true;
    if (G.L) {
      const active = G.mode === 'run' || G.mode === 'ready' || G.mode === 'done' || G.mode === 'over' || G.mode === 'title' || G.mode === 'board' || G.mode === 'ko';
      if (G.bossCardT > 0) G.bossCardT -= dt;
      if (G.hitstop > 0) { G.hitstop -= dt; G.coinPop = Math.max(0, (G.coinPop || 0) - dt); }
      else if (((G.mode === 'run' && !VG.Dialog.open) || G.mode === 'done' || G.mode === 'over' || G.mode === 'ko') && !guard.blocked) { for (let i = 0; i < (G.mul || 1); i++) if (G.mode === 'run' || i === 0) update(dt); }
      else if (active && G.mode !== 'run') { G.t += dt; if ((G.mode === 'title' || G.mode === 'board') && byId('pest').hidden) { G.cam += dt * 30; if (G.cam > G.W * TILE - st.VW) G.cam = 0; } updateParts(dt); }
      drawWorld(c);
      drawHud(c);
      // while someone talks the dialog takes the top of the screen: the chips step aside, nothing moves
      const talking = VG.Dialog.open;
      if (app.classList.contains('talking') !== talking) app.classList.toggle('talking', talking);
      if (G.count && G.clockTxt) drawCountdown(c, dt); // the midnight countdown: big golden pixel numbers
      else if (G.count) st.text(G.count, st.VW / 2, st.VH * 0.42, { size: Math.max(28, 14 * st.SCALE), col: '#ffd84a', align: 'center', stroke: '#1a1024' });
      if (G.cheer || G.happy) drawMidnight(c, dt);
      if (G.waitTap && G.mode === 'ready' && !VG.Dialog.open) drawTapToStart(c);
      if (fireworks || fw.length) drawFireworks(c, dt);
      if (conf.length) { VG.drawConfetti(c, conf, dt, G.t, st.VW, st.VH, false); conf = conf.filter(p => p.y < st.VH); }
    }
    st.flushText();
    requestAnimationFrame(frame);
  }
  // the midnight numbers, 5×7 pixels each, golden with a dark outline and a shadow
  const BIG_DIGITS = {
    3: ['.###.', '#...#', '....#', '..##.', '....#', '#...#', '.###.'],
    2: ['.###.', '#...#', '....#', '...#.', '..#..', '.#...', '#####'],
    1: ['..#..', '.##..', '#.#..', '..#..', '..#..', '..#..', '#####'],
  };
  function drawCountdown(c, dt) {
    G.countT = (G.countT || 0) + dt;
    const rows = BIG_DIGITS[G.count]; if (!rows) return;
    const a = G.countT, cell = VG.REDUCED ? 6 : (a < 0.08 ? 9 : a < 0.16 ? 8 : a < 0.3 ? 7 : 6), w = 5 * cell, h = 7 * cell, cy = Math.round(st.VH * 0.3);
    const x0 = Math.round(st.VW / 2 - w / 2), y0 = Math.round(cy - h / 2), k = '#1a1024';
    // a dark round backdrop, so the number stands out on any rooftop
    c.globalAlpha = 0.6; c.fillStyle = k; c.beginPath(); c.arc(st.VW / 2, cy, 34, 0, 7); c.fill(); c.globalAlpha = 1;
    c.strokeStyle = '#ffd84a'; c.lineWidth = 1; c.globalAlpha = 0.5; c.beginPath(); c.arc(st.VW / 2, cy, 34, 0, 7); c.stroke(); c.globalAlpha = 1;
    const cols = ['#fff6c8', '#fff2a8', '#ffe066', '#ffd84a', '#f6c23a', '#e8a52a', '#d48a1e'];
    // the ring of light
    if (!VG.REDUCED && a < 0.6) { c.globalAlpha = 1 - a / 0.6; c.strokeStyle = '#ffd84a'; c.lineWidth = 2; c.beginPath(); c.arc(st.VW / 2, cy, 36 + a * 100, 0, 7); c.stroke(); c.globalAlpha = 1; }
    const each = (fn) => rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === '#') fn(x0 + x * cell, y0 + y * cell, y); }));
        each((x, y) => R(c, x - 2, y - 2, cell + 4, cell + 4, k));
    each((x, y, r) => { R(c, x, y, cell, cell, cols[r]); R(c, x, y, cell, 1, 'rgba(255,255,255,.55)'); });
  }
  // «Tre! Due! Uno!» over their heads, then BUON ANNO! big in the middle
  function drawMidnight(c, dt) {
    if (G.cheer) {
      const ch = G.cheer; ch.t += dt; const lift = Math.round(Math.min(1, ch.t * 6) * 4), al = clamp((0.9 - ch.t) * 3, 0, 1);
      const sz = Math.max(13, 5.4 * st.SCALE), o = { size: sz, col: '#fff6e0', align: 'center', stroke: '#1a1024', shadow: false, alpha: al };
      st.text(ch.txt, sx(P.x), mapTop() + P.y - 36 - lift, o);
      if (G.croccoX > 0) st.text(ch.txt, sx(G.croccoX), mapTop() + G.croccoY - 40 - lift, o);
    }
    if (G.happy) {
      const hp = G.happy; hp.t += dt; const pop = VG.REDUCED ? 1 : hp.t < 0.12 ? 1.35 : hp.t < 0.24 ? 1.15 : 1, wob = VG.REDUCED ? 0 : Math.round(Math.sin(hp.t * 5) * 1.5);
      st.text(hp.txt || '', st.VW / 2, st.VH * 0.3 + wob, { size: Math.max(20, ((hp.txt || '').length > 22 ? 7 : 9) * st.SCALE) * pop, col: '#ffd84a', align: 'center', stroke: '#1a1024' });
    }
  }
  // one burst, on its own (the boss's KO, the stroke of midnight)
  function fwBurst(x, y) { const col = pick(['#ffd84a', '#ff6b57', '#7cc6e8', '#7fd18a', '#f2a3b0', '#b79cf0']); for (let i = 0; i < 30; i++) { const a = i / 30 * Math.PI * 2; fw.push({ x, y, vx: Math.cos(a) * rnd(45, 75), vy: Math.sin(a) * rnd(45, 75), life: 1.2, col }); } Audio.sfx('firework'); }
  function drawFireworks(c, dt) {
    if (fireworks && Math.random() < dt * 2.2) { const x = rnd(st.VW * 0.2, st.VW * 0.9), y = rnd(st.VH * 0.1, st.VH * 0.4), col = pick(['#ffd84a', '#ff6b57', '#7cc6e8', '#7fd18a', '#f2a3b0', '#b79cf0']); for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2; fw.push({ x, y, vx: Math.cos(a) * rnd(40, 70), vy: Math.sin(a) * rnd(40, 70), life: 1.1, col }); } Audio.sfx('firework'); }
    for (const f of fw) { f.life -= dt; f.vy += 40 * dt; f.x += f.vx * dt; f.y += f.vy * dt; c.globalAlpha = clamp(f.life, 0, 1); R(c, f.x, f.y, 1, 1, f.col); }
    c.globalAlpha = 1; fw = fw.filter(f => f.life > 0);
    if (G.mode === 'board' || G.mode === 'title') fireworks = 0;
  }

  paintTitle(); VG.fontsReady.then(paintTitle);
  showTitle();
  requestAnimationFrame(frame);

  // hooks for automated tests / video recordings
  // no zoom: Safari zooms with two fingers or a double tap even when the page says no
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  window.HR = { G, P, save, LEVELS, go, levelIntro, showBoard, startLevel, showWardrobe, setAuto: v => { G.auto = v; Bot.reset(); }, Bot, pose: falconPose };
})();

</script>
