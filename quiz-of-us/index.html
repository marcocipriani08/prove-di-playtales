<style>
/* Stile comune dei minigiochi di El Falcon e Il Crocco: stesso aspetto di Operazione Viaggettino
   (notte viola, limone, corallo, Pixelify Sans + VT323, pannelli con bordo chiaro e ombra piena). */
:root {
  --vw: 1vw; --vh: 1vh;   /* on a computer: phone-sized units (see html.desk) */
  --night: #1b1530; --night-2: #120e24; --panel: #2a2145; --panel-2: #352a58; --line: #4a3d78;
  --ink: #fff6e0; --ink-dim: #c9bfe0; --lemon: #ffd84a; --lemon-dk: #d9b21f; --coral: #ff6b57; --sea: #7cc6e8; --leaf: #7fd18a; --rose: #f2a3b0;
  --paper: #fff6e0; --paper-ink: #2a1a2e; --red: #c0392b;
  --f-display: "Pixelify Sans", "Courier New", monospace; --f-num: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif; --f-body: "VT323", "Courier New", monospace; --f-hand: "Caveat", "Comic Sans MS", cursive;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
body { background: var(--night-2); color: var(--ink); overflow: hidden; overscroll-behavior: none; font-family: var(--f-display); -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
button, input { font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
#app { position: fixed; inset: 0; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; background: var(--night-2); }
canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
#cv { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
#fx { position: absolute; left: 0; top: 0; pointer-events: none; }
button { font-family: var(--f-display); color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--lemon); outline-offset: 2px; }

/* Top bar chips */
.topbar { position: absolute; top: calc(8px + var(--sat)); right: max(10px, var(--sar)); display: flex; gap: 6px; z-index: 30; }
.chip { background: rgba(18,14,36,.72); border: 2px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--ink); line-height: 1; }
.chip:active { background: var(--panel-2); }

/* Big buttons (title, panels) */
.btn { border: 3px solid var(--paper-ink); border-radius: 12px; padding: 13px 16px; font-size: 18px; font-weight: 700; background: var(--ink); color: var(--paper-ink); box-shadow: 0 5px 0 var(--paper-ink); line-height: 1.05; transition: transform .06s, box-shadow .06s; }
.btn.primary { background: var(--lemon); }
.btn.leaf { background: var(--leaf); }
.btn.ghost { background: transparent; color: var(--ink-dim); border-color: var(--line); box-shadow: none; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--paper-ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 17px; opacity: .8; margin-top: 2px; }

/* Title screen */
.title { position: absolute; inset: 0; z-index: 20; overflow-y: auto; background: linear-gradient(180deg, #2a1f55 0%, #6a3a6e 48%, #e86a5a 78%, #ffb36b 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: calc(24px + var(--sat)) max(16px, var(--sar)) calc(24px + var(--sab)) max(16px, var(--sal)); text-align: center; }
.title::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 16%; background: repeating-linear-gradient(180deg, #2a2a6a 0 4px, #3a3a8a 4px 8px); opacity: .9; pointer-events: none; }
.t-eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--lemon); position: relative; z-index: 1; }
.t-name { margin: 0; font-size: clamp(34px, calc(10 * var(--vw)), 64px); line-height: .92; font-weight: 700; color: var(--ink); text-shadow: 3px 3px 0 var(--paper-ink), 6px 6px 0 rgba(0,0,0,.25); position: relative; z-index: 1; text-wrap: balance; }
.t-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; width: min(100%, 300px); position: relative; z-index: 1; }


/* ===== Copertina: la scena del Fallo Carico in posa, con l'insegna al neon «Quiz of Us» sul tetto ===== */
.title { background: transparent; justify-content: flex-end; gap: 10px; padding-bottom: calc(96px + var(--sab)); }
.title::after { display: none; }
.t-sign { position: absolute; left: 50%; top: 40%; z-index: 1; transform: translate(-50%, calc(-100% - 10px)); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.t-eyebrow { text-shadow: 2px 2px 0 #1a1024; }
.t-board { position: relative; padding: 10px 22px 12px; background: #2a1a2e; border: 4px solid #8a7fb8; border-radius: 8px;

  /* Verdict ticket */

  /* the till and its ticket */

  /* ===== copied from Memory Lane: the Album that fills and closes, the pages to leaf through, the pocket, the letter ===== */
  /* the end of the game: all the photos fly into one Album, which closes */
  #assemble { position: absolute; inset: 0; z-index: 34; animation: abIn .6s ease both; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: calc(64px + var(--sat)) 16px calc(16px + var(--sab)); background: rgba(10,7,22,.62); }

  .ab-r { background: repeating-linear-gradient(0deg, transparent 0 13px, rgba(166,124,82,.08) 13px 14px), linear-gradient(90deg, #e8d6ae 0, #fbefd2 9%, #fdf4dc 60%, #f3e3bd 100%); border-radius: 2px 8px 8px 2px; box-shadow: 0 0 0 3px var(--paper-ink), 2px 2px 0 1px #e9dcbc, 4px 4px 0 1px #d8c79f, 6px 6px 0 1px var(--paper-ink), 9px 11px 0 rgba(10,7,22,.4); }

  .ab-front::after { content: ""; position: absolute; right: 0; top: 4px; bottom: 4px; width: 14px; background: linear-gradient(90deg, transparent, rgba(42,26,46,.22)); pointer-events: none; }

  .ab-slot { background: rgba(42,26,46,.07); border: 1.5px dashed rgba(42,26,46,.22); border-radius: 2px; transform: rotate(var(--rot)); }

    background: linear-gradient(135deg, #e7b84a 0 13px, transparent 13px) top left / 50% 50% no-repeat, linear-gradient(225deg, #e7b84a 0 13px, transparent 13px) top right / 50% 50% no-repeat, linear-gradient(45deg, #e7b84a 0 13px, transparent 13px) bottom left / 50% 50% no-repeat, linear-gradient(315deg, #e7b84a 0 13px, transparent 13px) bottom right / 50% 50% no-repeat; }

<script>
/* motore/testi.js */
/* Quiz of Us — i testi su misura: legge l'ordine (window.ORDINE) e riempie i segnaposto delle battute del motore.
   Caricato subito dopo l'ordine, prima di tutto il resto.

   Chi risponde alle domande è sempre chi riceve il regalo: se il regalo è per il coprotagonista, i due si scambiano qui
   (come in Memory Lane e Run to You), così tutto il motore parla sempre di «a» (chi risponde) e «b» (l'altro).

   Segnaposto (TXT.t):
     {A} {B}        nome di chi risponde / dell'altro
     {a} {b}        soprannome (o il nome, se non c'è)
     {dest}         a chi è dedicata la lettera: «{a}» oppure «{a} e {b}» (regalo per tutti e due)
     {boss}         il nome dell'antagonista, con il suo articolo se ce l'ha («Il Consulente Grigio»)
     {motto}        la sua presentazione (il motto del nastro) con l'iniziale minuscola, senza punto finale; {ingresso} la sua battuta su misura
     {di boss} {a boss} {da boss} {su boss} {con boss}   preposizione + articolo giusti («del Consulente Grigio»)
     Con l'iniziale maiuscola ({Boss}) la prima lettera diventa maiuscola. */
'use strict';
const TXT = (() => {
  const O = window.ORDINE;
  // who answers is who receives the gift
  if (O.regalo && O.regalo.per === 'b') {
    const p = O.protagonisti; O.protagonisti = { a: p.b, b: p.a };
    if (O.regalo.da === 'a') O.regalo.da = 'b'; else if (O.regalo.da === 'b') O.regalo.da = 'a';
    O.regalo.per = 'a'; O.regalo.scambiati = true;
    // «Chi l'ha detto?» follows the swap
    (O.capitoli || []).forEach(c => [c.luogo].concat(c.ricordi || []).forEach(x => (x.domande || []).forEach(d => { if (d.chi) d.chi = d.chi === 'a' ? 'b' : 'a'; })));
  }
  const P = O.protagonisti, sop = p => (p.soprannome || '').trim() || p.nome;
  const entrambi = !!(O.regalo && O.regalo.per === 'entrambi');
  const ant = O.antagonista || {};
  // the article of a name: «Il Consulente Grigio» → { art: 'il', rest: 'Consulente Grigio' }
  function split(s) {
    const m = String(s || '').match(/^(il|lo|la|i|gli|le|l')\s*(.*)$/i);
    return m ? { art: m[1].toLowerCase(), rest: m[2] } : { art: '', rest: String(s || '') };
  }
  const PREP = {
    a: { il: 'al', lo: 'allo', la: 'alla', i: 'ai', gli: 'agli', le: 'alle', "l'": "all'" },
    di: { il: 'del', lo: 'dello', la: 'della', i: 'dei', gli: 'degli', le: 'delle', "l'": "dell'" },
    da: { il: 'dal', lo: 'dallo', la: 'dalla', i: 'dai', gli: 'dagli', le: 'dalle', "l'": "dall'" },
    su: { il: 'sul', lo: 'sullo', la: 'sulla', i: 'sui', gli: 'sugli', le: 'sulle', "l'": "sull'" },
    con: { il: 'con il', lo: 'con lo', la: 'con la', i: 'con i', gli: 'con gli', le: 'con le', "l'": "con l'" }
  };
  const glue = (a, rest) => a.endsWith("'") ? a + rest : a + ' ' + rest;
  function withPrep(prep, name) {
    const { art, rest } = split(name);
    if (!art) return prep + ' ' + rest;
    return glue(PREP[prep][art], rest);
  }
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const low = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : s;
  const V = { A: P.a.nome, B: P.b.nome, a: sop(P.a), b: sop(P.b), dest: entrambi ? sop(P.a) + ' e ' + sop(P.b) : sop(P.a), boss: ant.nome || '',
    // the villain's motto after his name («Io sono Il Consulente Grigio, nemico giurato delle ferie altrui.») and his line made to measure
    motto: low((ant.presentazione || '').trim().replace(/[.!]+$/, '')), ingresso: (ant.ingresso || '').trim() };
  function t(s) {
    if (typeof s !== 'string') return s;
    return s
      .replace(/\{(a|di|da|su|con) boss\}/g, (m, p) => withPrep(p, V.boss))
      .replace(/\{([A-Za-z]+)\}/g, (m, k) => {
        if (k in V) return V[k];
        const low = k.charAt(0).toLowerCase() + k.slice(1);
        if (low in V && k !== low) return cap(V[low]);
        return m;
      });
  }
  return { t, V, entrambi, withPrep, cap };
})();
</script>

// a double tap must not zoom or move the page: the game is one fixed screen
(() => {
  let last = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - last < 320 && e.touches.length === 0 && e.changedTouches.length === 1) e.preventDefault();
    last = now;
  }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });   // iOS pinch
  addEventListener('scroll', () => { if (scrollY || scrollX) scrollTo(0, 0); }, { passive: true });
})();

    else if (top === 'plaid') { pts(skin, [[6, T], [7, T]]); pts(clothL, [[5, T], [8, T]]); }
    else if (top === 'sweater') pts(clothD, [[5, T], [6, T], [7, T], [8, T]]); // the turtleneck
    else if (top === 'hoodie') { pts(C.white, [[6, T + 1], [7, T + 1]]); const py = Math.min(B.wide ? T + 4 : T + 3, T + nT - 1); for (let x = 5; x <= 8; x++) put(x, py, clothD); } // Il Crocco
    else if (top === 'jacket') { for (let y = T + 1; y <= T + 2; y++) pts(C.white, [[6, y], [7, y]]); pts(clothD, [[3, T + 3], [10, T + 3]]); } // El Falcon
    if (kind === 'skirt') for (let y = T + nT - skirtUp(nT); y < T + nT; y++) { const [a, b] = B.torso[y - T]; for (let x = a; x <= b; x++) put(x, y, legsC); }
    if (head.shoulders) head.shoulders.forEach(([x, c]) => put(x, T, pal[c]));
    // face: brows, eyes (dots, with lashes, or closed and smiling), the mouth (closed, smiling, with teeth, tongue out);
    // the mouth stays below the glasses row, so a smile never hides under the lenses
    const sad = mood === 'sad', wow = mood === 'wow';
    const browC = lum(hairC) > 0.55 ? dark(hairC, 0.55) : lum(hairC) > 0.3 ? dark(hairC, 0.4) : dark(hairC, 0.15);
    if (ch.brows === 'thick') pts(browC, [[3, E - 1], [4, E - 1], [5, E - 1], [8, E - 1], [9, E - 1], [10, E - 1]]);
    else if (ch.brows === 'thin') pts(mix(browC, skin, 0.2), [[4, E - 1], [5, E - 1], [8, E - 1], [9, E - 1]]);
    // the eye row is always skin (the row above can be a fringe): lashes are a wing at the outer side, smiling eyes a ^ over two rows
    const smile = ch.eyeShape === 'smile';
    if (ch.blush === 'on') pts(C.blush, smile ? [[3, E + 2], [10, E + 2]] : [[3, E + 1], [10, E + 1]]);

    if (smile) pts(eye, [[3, E + 1], [4, E], [5, E + 1], [8, E + 1], [9, E], [10, E + 1]]);

    else if (fh === 'mustache') for (let x = 5; x <= 8; x++) put(x, E + 1, hair);
    else if (fh === 'goatee') pts(hair, [[6, E + 3], [7, E + 3]]);
    // the closed mouth is one pixel (column 7, a little to the side, as El Falcon's); the others are as before
    if (wow) pts(C.mouthD, [[6, E + 2], [7, E + 2], [6, E + 3], [7, E + 3]]);
    else if (sad) pts(C.mouthD, [[6, E + 2], [7, E + 2], [5, E + 3], [8, E + 3]]);
    else if (mouth === 'smile') pts(C.mouth, [[5, E + 2], [8, E + 2], [6, E + 3], [7, E + 3]]);
    else if (mouth === 'teeth') { pts(C.mouthD, [[5, E + 2], [8, E + 2], [6, E + 3], [7, E + 3]]); pts(C.white, [[6, E + 2], [7, E + 2]]); }
    else if (mouth === 'tongue') { pts(C.mouthD, [[6, E + 2], [7, E + 2]]); put(7, E + 3, C.pink); }

  /* ---------------- side and back views (added 21 nov 2026, see REGOLE-PERSONAGGI.md) ----------------
   * The front view above is unchanged. The side view looks to the right (the left one is its mirror) and is drawn
   * like El Falcon and Il Crocco from the side in Operazione Viaggettino: the back of the head on the left, one eye,
   * the nose sticking out, a narrower body with one arm in front, the legs that step. The back view is the front one
   * with the hair over the whole head and no face. Same grid (14×21), same outline, same floor line. */
  function looks(ch) {
    const skin = ch.skin || '#f1c7a1', hairC = ch.hairColor || '#2b2020', cloth = ch.outfit || '#d64545';
    const light = cloth.toUpperCase() === '#FFFFFF';
    const head = HEADS[ch.hairStyle] || HEADS.short;
    const B = (BODIES[ch.height] || BODIES.normal)[ch.body] || BODIES.normal.soft;
    const hair = head.buzz ? mix(skin, hairC, 0.6) : hairC;
    const known = EXACT[hair.toLowerCase()] || {};
    const pal = { h: hair, H: head.buzz ? hair : known.H || mix(hair, '#ffe9c8', 0.3), o: head.buzz ? hair : known.o || mix(hair, '#5a3a10', 0.3), b: mix(skin, hairC, 0.6), s: skin, L: mix(skin, '#ffffff', 0.4), S: EXACT_SHADE[skin.toLowerCase()] || mix(skin, '#a5502a', 0.3) };

    const legsD = legsC.toUpperCase() === '#FFFFFF' ? '#c9c2d8' : dark(legsC, 0.3);
    const legSet = LEGS[B.legs] || LEGS[3];
    const acc = ch.accessories || {};
    return { skin, hairC, cloth, light, head, B, hair, pal, clothD, clothL, legsC, legsD, shoe, eye, top, dress, kind, nL: legSet.stand.length, acc,
      gc: ch.glassesColor || C.ink, browC: lum(hairC) > 0.55 ? dark(hairC, 0.55) : lum(hairC) > 0.3 ? dark(hairC, 0.4) : dark(hairC, 0.15) };
  }

  function raster(rows, W = SW, H = SH) { // the grid (W×H, the standard one unless a pose needs another) plus the outline

    });

  }

    let righe = d.pose[posa]; if (Array.isArray(righe[0])) righe = righe[(o.fotogramma || 0) % righe.length];
    const tipi = d.tipi ? Object.keys(d.tipi) : [], tipo = d.tipi && d.tipi[o.tipo] ? o.tipo : tipi[0];
    return { righe, pal: Object.assign({}, d.pal, tipo ? d.tipi[tipo] : {}) };
  }
  const sprite = (nome, o = {}) => { const g = griglia(nome, o); return pixelSprite(g.righe, g.pal, o.specchio); };

  // the checks: rows of the same width, every letter in the palette, a name of letters, digits and _
  function validate() {
    const err = [];
    NOMI.forEach(n => {
      const d = DISEGNI[n]; if (!/^[a-z0-9_]+$/.test(n)) err.push(`${n}: nome con lettere minuscole, numeri e _`);

        (d.tipi ? Object.keys(d.tipi) : [null]).forEach(t => { const pal = Object.assign({}, d.pal, t ? d.tipi[t] : {});

      }));
    });
    return err;
  }

  return { VERSION, CONTORNO, pixelSprite, DISEGNI, NOMI, griglia, sprite, validate };

function humanoid(o) {
  const hair = o.hair || 'short';
  let head;
  if (hair === 'bald') head = ['....ssss....', '..ssssssss..', '..ssssssss..'];
  else if (hair === 'bun') head = ['....AAAA....', '..AAAAAAAA..', '..AssssssA..'];

  if (o.glasses) core = 'kekkkkek';
  if (o.shades) core = 'kkkkkkkk';
  if (o.monocle) core = 'ssesYeYs';

  let chin = '...ssssss...';

    const ch = rows[y][x]; if (ch === '.') continue;

}

}

  const c = o.getContext('2d');

  c.drawImage(cv, 1, 1); return o;
}

<script>

'use strict';
// El Falcon's look (costume and jewels) is shared by the three games: bought in Heart Run, worn everywhere
window.VG_JEWELS = '';

const VG = (() => {
  const byId = id => document.getElementById(id);

  const pick = a => a[Math.floor(Math.random() * a.length)];

  const wait = ms => new Promise(r => setTimeout(r, ms));
  const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  const SAVE = window.SALVATAGGIO || 'qou_';

  const put = (rows, y, x, str) => { if (!rows[y]) return; rows[y] = rows[y].slice(0, x) + str + rows[y].slice(x + str.length); };
  const COSTUMES = {
    classica: { name: 'Giacca rossa', price: 0 },
    verde: { name: 'Giacca verde', price: 60, map: { r: '#3f9a4a', R: '#2e7a38' } },

    return (SPRITE_CACHE[k] = c);

    whiteCache.set(img, w); return w;

  function draw(c, img, x, y, o) {
    o = o || {};
    const dx = Math.round(x - img.width / 2), dy = Math.round(y - img.height);
    if (o.alpha !== undefined) c.globalAlpha = o.alpha;

  const SPEAKERS = {
    falcon: { name: TXT.V.A, col: '#ffd84a', img: () => falcon('down') },

  // ---------------- canvas scene: the terrace of the Fallo Carico at night ----------------
  const st = VG.stage(byId('cv'), byId('fx'), { target: 190 });

  function layout() {

  // the cards of this game, measured once (hidden, in the same frame): the floor sits where a card of average

  // a guided tap: the screen goes dark except the target, and only a tap on the target counts

  function spotlightTap(target, label) {

      blk.append(hole, tip); byId('app').appendChild(blk);

      ['✓ Giusta', () => hit(1), showing],
      ['✗ Sbagliata', () => hit(0), showing],
      ['⚡ Fulmine', () => { S.tLeft = S.tMax + S.extra; hit(1); }, showing],
      ['⏭ Salta', () => { S.locked = true; S.timerOn = false; S.i++; next(); }, showing],
      ['Fine partita', () => { S.locked = true; S.timerOn = false; S.i = S.list.length; next(); }, showing]
    ]);
    group('Prossima domanda', [
      ['★ Domanda d\'oro', () => { const t = Math.min(S.i + 1, S.list.length - 1); S.gold = t; S.goldShown = false; saveCur(); VG.toast('La prossima è d\'oro', 1400); }, showing && !S.flash && S.i < S.list.length - 1],
      ['Raddoppia o lascia', () => { if (!S.score) S.score = 100; S.dqAsked = false; S.locked = true; S.timerOn = false; S.i = S.list.length - 1; next(); }, showing && !S.flash],
      ['Rimetti la fuori concorso', () => { save.bonusDone = false; persist(); VG.toast('Tornerà a fine partita', 1400); }]
    ]);
    group('Progressi', [
      ['+1 cartolina', () => { const e = ALBUM.find(e => !save.cards[e.i]); if (e) { testGive(e.i); persist(); VG.toast('Cartolina: ' + e.name.split(' · ')[0], 1400); } refresh(); }],
      ['11 cartoline', () => { ALBUM.forEach(e => testGive(e.i)); const L = ALBUM[ALBUM.length - 1]; L.qs.forEach((Q, j) => { delete save.answered[`a${L.i}q${j}`]; delete save.right[`a${L.i}q${j}`]; }); delete save.cards[L.i]; save.assembled = false; delete save.cur; persist(); showGameMenu(); }],
      ['Album completo', () => { testAll(); save.assembled = false; persist(); assembleAlbum(); }],
      ['Apri la lettera', () => { testAll(); save.assembled = true; persist(); openLetter(); }],
      ['Dopo la lettera (il Grigio)', () => { testAll(); Object.assign(save, { assembled: true, ending: true, afterIntro: false, villainMet: false, photo: false }); persist(); showGameMenu(true); }]
    ]);
    group('Sfide del Grigio', [
      ['Tutte tranne una', () => { testAll(); Object.assign(save, { assembled: true, ending: true, afterIntro: true, villainMet: true, photo: false }); save.fx = { done: true, bestRight: CONTENT.flashCount, perfect: true, bolts6: true, steady: true, beatRec: false, bestPts: CONTENT.flashGoal }; save.mdone = {}; checkMissions(); persist(); showChallenges(); }],
      ['Tutte (finale)', () => { testAll(); Object.assign(save, { assembled: true, ending: true, afterIntro: true, villainMet: true, photo: false, doneScreen: false }); save.fx = { done: true, bestRight: CONTENT.flashCount, perfect: true, bolts6: true, steady: true, beatRec: true, bestPts: CONTENT.flashGoal }; checkMissions(); persist(); showGameMenu(); }],
      ['Foto già ripresa', () => { testAll(); Object.assign(save, { assembled: true, ending: true, afterIntro: true, villainMet: true, photo: true }); save.fx = { done: true, bestRight: CONTENT.flashCount, perfect: true, bolts6: true, steady: true, beatRec: true, bestPts: CONTENT.flashGoal }; checkMissions(); persist(); showGameMenu(); }]
    ]);
    group('Avanti e indietro', [
      ['Salva stato', () => { VG.store.set('quiz-test', JSON.parse(JSON.stringify(save))); VG.toast('Stato salvato', 1200); }],
      ['Torna allo stato salvato', () => { const o = VG.store.get('quiz-test', null); if (!o) { VG.toast('Nessuno stato salvato', 1400); return; } Object.keys(save).forEach(k => delete save[k]); Object.assign(save, o); persist(); showTitle(); }],
      ['Azzera tutto', () => { resetAll(); showTitle(); }]
    ]);
    wrap.addEventListener('pointerdown', e => { if (e.target === wrap) close(); });
    wrap.appendChild(pnl); byId('app').appendChild(wrap);
  }
  if (TEST_MODE) { const chip = el('button', 'chip test-chip', '🛠'); chip.setAttribute('aria-label', 'Pannello test'); chip.type = 'button'; chip.onclick = openTest; byId('app').appendChild(chip); }

  // ---------------- input ----------------
  window.addEventListener('keydown', e => {
    if (VG.Dialog.open || S.locked || S.paused) return;
    const k = e.key.toLowerCase();
    if (document.querySelector('.tf')) { const i = k === 'v' || k === '1' || k === 'arrowleft' ? 0 : k === 'f' || k === '2' || k === 'arrowright' ? 1 : -1; if (i >= 0) document.querySelectorAll('.tf')[i].click(); return; }
    const i = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
    if (i >= 0) { const b = document.querySelectorAll('.ans')[i]; if (b && !b.disabled) b.click(); }
  });
  // «Continua»: back into the game left halfway, or the next 12 questions
  byId('t-play').onclick = async () => {
    Audio.unlock();
    if (!(save.cur || save.games || Object.keys(save.answered).length)) { start(false); return; }
    const tl = byId('title'); if (tl.classList.contains('leaving')) return;
    tl.classList.add('leaving'); veil(true); await wait(VG.REDUCED ? 1 : 380);
    tl.classList.remove('leaving'); showGameMenu(); setTimeout(() => veil(false, true), 60);
  };

  byId('t-reset').onclick = askReset;
  byId('b-exit').onclick = () => { if (VG.Dialog.open) return; askExit(); };
  // «Salta»: the intro jumps to the title card
  byId('b-skip').onclick = () => { S.introSkip = true; for (let i = 0; i < 80 && VG.Dialog.open; i++) VG.Dialog.advance(); };
  // «Nuova partita»: everything starts again from zero, after a clear question
  function askReset() {
    const wrap = el('div', 'overlay'); wrap.id = 'ask-reset';
    const pnl = el('div', 'panel ask', `<h2>Ricominciare da zero?</h2><p>Così facendo si perderanno tutti i progressi: cartoline, medaglie e record. Il gioco ricomincerà dall'inizio. Vuoi continuare?</p>`);
    const row = el('div', 'row');
    const no = el('button', 'btn primary', 'No'); no.type = 'button';
    const yes = el('button', 'btn danger', 'Sì, ricomincia'); yes.type = 'button';
    no.onclick = () => wrap.remove();
    yes.onclick = () => { wrap.remove(); resetAll(); start(false); };
    wrap.addEventListener('pointerdown', e => { if (e.target === wrap) wrap.remove(); });
    row.append(no, yes); pnl.appendChild(row); wrap.appendChild(pnl); byId('app').appendChild(wrap);
    no.focus();
  }
  function resetAll() {
    Object.keys(save).forEach(k => delete save[k]);
    Object.assign(save, { best: 0, bestFlash: 0, done: false, answered: {}, right: {}, cards: {}, v: 2 });
    persist();
  }
  function askExit() {
    // «Menu»: straight to the game menu, no questions (the quiz is saved at every question)
    if (S.mode === 'play' && !S.flash) saveCur();
    showGameMenu();
  }
  VG.muteChip(byId('b-mute'));

  // title texts come from CONTENT
  document.querySelector('.t-eyebrow').textContent = CONTENT.title.eyebrow;
  document.querySelector('.t-name').textContent = CONTENT.title.name;
  document.title = CONTENT.title.name;
  showTitle();
  requestAnimationFrame(frame);
  // hooks for automated runs / video recording
  window.QUIZ = { S, save, start, openLetter, CONTENT, scene, answerRight: () => { const b = [...document.querySelectorAll('.ans, .tf')].find(x => x.dataset.ok === '1'); if (b) b.click(); } };
})();

</script>
</body>
</html>
